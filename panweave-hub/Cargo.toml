[package]
name = "panweave-hub"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Panweave Zigbee hub: device registry, interview, IAS Zone and lighting logic, and the Panweave Hub Protocol shared with host applications"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["engine"]
# The hub application logic on top of the Panweave stack. Without it the
# crate is only the protocol (message types and framing), which is what
# a host application needs.
engine = [
    "dep:panweave-runtime",
    "dep:panweave-storage",
    "dep:panweave-zcl",
    "dep:panweave-zdo",
    "dep:panweave-aps",
    "dep:panweave-security",
    "dep:panweave-nwk",
]
std = ["panweave-types/std", "panweave-codec/std"]
# Radio frame capture in the hub engine: the bounded frame buffer
# (`CAPTURE_FRAMES` frames) and the capture requests. Without it the
# engine holds no capture state and answers the capture requests with
# `NotSupported`; the protocol types stay available either way.
radio-capture = ["engine"]
# Experimental critical-event notifications over Wi-Fi (Zigbee → Wi-Fi →
# Zigbee on one radio): the durable alert queue, delivery schedule,
# Telegram request / response handling and the attempt orchestrator.
# Off by default; without it the alert requests answer `NotSupported`.
# The radio switching itself is the firmware's (docs/esp32c6-wifi-alerts.md).
alerts = ["engine"]
# The hub as Green Power Combo Basic sink: Green Power Devices
# (battery-less switches) commissioned and their commands reported.
green-power = ["engine", "panweave-runtime/green-power", "dep:panweave-green-power"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
panweave-types = { workspace = true }
panweave-codec = { workspace = true }
heapless = { workspace = true }
panweave-runtime = { workspace = true, optional = true }
panweave-storage = { workspace = true, optional = true }
panweave-zcl = { workspace = true, optional = true }
panweave-zdo = { workspace = true, optional = true }
panweave-aps = { workspace = true, optional = true }
panweave-security = { workspace = true, optional = true }
panweave-nwk = { workspace = true, optional = true }
panweave-green-power = { workspace = true, optional = true }

[dev-dependencies]
# The feature-gated Green Power tests run in the gate (`cargo test`
# builds the crate with this feature for its tests).
panweave-hub = { path = ".", features = ["green-power"] }
panweave-green-power = { workspace = true }
panweave-security = { workspace = true, features = ["crypto-software"] }
panweave-sim = { workspace = true }
panweave-testkit = { workspace = true }
panweave-mac = { workspace = true }
panweave-storage = { workspace = true }
panweave-pcap = { workspace = true }

[lints]
workspace = true
