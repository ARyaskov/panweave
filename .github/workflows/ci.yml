name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  gate:
    name: fmt / clippy / test / doc / conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --doc --workspace
      - run: cargo test -p panweave-storage --features nor-flash,std
      - run: cargo run --quiet -p xtask -- conformance --check
      - run: cargo run --quiet -p xtask -- codegen --check
      - name: no_std builds
        run: |
          for crate in panweave-types panweave-codec panweave-mac panweave-security panweave-nwk panweave-aps panweave-zdo panweave-zcl panweave-storage panweave-runtime panweave-bdb panweave-device-library panweave-green-power panweave-direct panweave-smart-energy panweave; do
            cargo build -p "$crate" --no-default-features --target thumbv7em-none-eabihf
          done
          cargo build -p panweave-storage --no-default-features --features nor-flash --target thumbv7em-none-eabihf

  feature-matrix:
    name: feature matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "std", "alloc", "serde", "defmt"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: build with features "${{ matrix.features }}"
        run: cargo build --workspace --no-default-features ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}

  msrv:
    name: MSRV 1.95
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  small-tables:
    name: small-tables profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p panweave-runtime -p panweave --features panweave-runtime/small-tables,panweave-runtime/green-power,panweave-runtime/dlk,panweave-runtime/std,panweave/small-tables,panweave/crypto-software,panweave/std,panweave/smart-energy,panweave/direct,panweave/dlk

  footprint:
    name: Cortex-M4F footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/size-probe
      - name: default tables
        working-directory: examples/size-probe
        run: |
          cargo build --release
          python3 ../../scripts/elf_size.py target/thumbv7em-none-eabihf/release/panweave-size-probe --components
      - name: small tables, every feature
        working-directory: examples/size-probe
        run: |
          cargo build --release --features small-tables,green-power,dlk,direct,smart-energy
          python3 ../../scripts/elf_size.py target/thumbv7em-none-eabihf/release/panweave-size-probe --components

  esp32c6:
    name: ESP32-C6 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: riscv32imac-unknown-none-elf
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-super-mini
      - name: build the four firmware images
        working-directory: examples/esp32c6-super-mini
        run: |
          cargo build --release --bins
          cargo clippy --release --bins -- -D warnings
          for b in on_off_light coordinator switch temperature_sensor; do
            python3 ../../scripts/elf_size.py target/riscv32imac-unknown-none-elf/release/$b
          done

  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
      - name: short fuzz smoke run
        run: |
          for t in $(cargo fuzz list); do
            cargo fuzz run "$t" -- -max_total_time=20 -max_len=256
          done

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
