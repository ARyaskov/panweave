[package]
name = "panweave-device-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Panweave Zigbee stack: the Device Type Library (device identifiers, mandatory clusters, descriptor validation, finding & binding roles)"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
std = ["alloc", "panweave-types/std"]
alloc = ["panweave-types/alloc"]
serde = ["dep:serde", "panweave-types/serde"]
defmt = ["dep:defmt", "panweave-types/defmt"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
panweave-types = { workspace = true }
serde = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[lints]
workspace = true
