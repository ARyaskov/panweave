[package]
name = "panweave-esp32c6"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Panweave Zigbee 4.0 on the ESP32-C6 Super Mini: the radio, flash, RNG and clock adapters, and example firmware"
license = "MIT OR Apache-2.0"

[dependencies]
panweave = { path = "../../panweave", default-features = false, features = ["crypto-software"] }
panweave-runtime = { path = "../../panweave-runtime", default-features = false }
panweave-storage = { path = "../../panweave-storage", default-features = false, features = ["nor-flash"] }
panweave-hub = { path = "../../panweave-hub" }
esp-hal = { version = "1.2.1", features = ["esp32c6", "unstable"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c6", "ieee802154", "unstable"] }
esp-storage = { version = "0.10.0", features = ["esp32c6", "bytewise-read", "embedded-storage"] }
# `internal-heap-stats`: the hub reports the heap's peak use.
esp-alloc = { version = "0.11.0", features = ["esp32c6", "internal-heap-stats"] }
esp-backtrace = { version = "0.20.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c6"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }
heapless = { version = "0.9", default-features = false }
embedded-storage = "0.3.1"
# Interrupts off while the hub paints its stack for the watermark
# (`src/memory.rs`); already in the tree through esp-hal.
critical-section = "1.2.0"
# Experimental Wi-Fi notifications only (feature `wifi-alerts`): the
# preemptive scheduler Wi-Fi needs.
esp-rtos = { version = "0.4.0", features = ["esp32c6", "esp-radio", "esp-alloc"], optional = true }
# ... and the network of a delivery: DHCP, DNS, TCP (embassy-net, its
# time driver from esp-rtos) and TLS 1.3 with certificate verification
# (embedded-tls; `rsa` for the RSA chain of api.telegram.org).
embassy-net = { version = "0.9.1", default-features = false, features = ["proto-ipv4", "medium-ethernet", "dhcpv4", "dns", "tcp"], optional = true }
# The hub polls futures with Waker::noop(), outside an Embassy executor.
# esp-rtos otherwise defaults to an integrated timer queue which assumes
# every waker belongs to an Embassy task (DHCP's first timer would panic).
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-8"], optional = true }
embedded-tls = { version = "0.19.0", default-features = false, features = ["rustpki", "rsa"], optional = true }

[features]
default = ["capture"]
# Green Power Basic Proxy on the router firmware.
green-power = ["panweave-runtime/green-power"]
# Smaller ZCL tables (docs/footprint.md).
small-tables = ["panweave/small-tables"]
# Hub: radio frame capture for diagnostics (bounded, sanitized by
# default, off until an Admin host starts one; docs/esp32c6-diagnostics.md).
# Without it the hub engine holds no capture buffer.
capture = ["panweave-hub/radio-capture"]
# EXPERIMENTAL: Zigbee -> Wi-Fi -> Zigbee on the one radio
# (docs/esp32c6-wifi-alerts.md). Builds only from
# `examples/esp32c6-wifi-alerts`, whose patched esp-radio allows Wi-Fi
# and 802.15.4 in one image for strictly sequential use; enabled here it
# hits esp-radio's own build guard, on purpose.
wifi-alerts = [
    "esp-radio/wifi",
    "dep:esp-rtos",
    "esp-rtos/embassy",
    "dep:embassy-net",
    "dep:embassy-time-queue-utils",
    "dep:embedded-tls",
    "panweave-hub/alerts",
]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = true
incremental = false

[profile.dev]
opt-level = 1

[build-dependencies]
panweave-hub = { path = "../../panweave-hub", default-features = false }
