[package]
name = "panweave-lite-probe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Cortex-M33 footprint and stack probe of a Panweave Lite IAS Zone sensor: an EFR32MG22 (32 KiB RAM) link build and a QEMU MPS2-AN505 build that commissions against a full coordinator and measures the peak stack"

[dependencies]
panweave-lite = { path = "../../panweave-lite", default-features = false }
panweave-runtime = { path = "../../panweave-runtime", default-features = false }
panweave-security = { path = "../../panweave-security", default-features = false, features = ["crypto-software"] }
panweave-storage = { path = "../../panweave-storage", default-features = false, features = ["nor-flash"] }
panweave-mac = { path = "../../panweave-mac", default-features = false }
panweave-types = { path = "../../panweave-types", default-features = false }
panweave-zcl = { path = "../../panweave-zcl", default-features = false }
panweave-zdo = { path = "../../panweave-zdo", default-features = false }
panweave-bdb = { path = "../../panweave-bdb", default-features = false }
panweave-testkit = { path = "../../panweave-testkit", default-features = false }
embedded-storage = "0.3.1"
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = { version = "0.5", optional = true }
panic-halt = "1"

[features]
default = []
# Curve25519 dynamic link keys (Zigbee 4.0 / R23 key negotiation).
dlk = ["panweave-lite/dlk", "panweave-runtime/dlk", "panweave-security/dlk"]
# QEMU MPS2-AN505 build: a full coordinator in a separate RAM region,
# a commissioning scenario and stack measurement over semihosting.
qemu = ["dep:cortex-m-semihosting"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
panic = "abort"
