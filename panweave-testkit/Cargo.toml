[package]
name = "panweave-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Panweave Zigbee stack: virtual clock, deterministic RNG helpers and a virtual radio medium for tests"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
std = ["alloc", "panweave-types/std", "panweave-mac/std"]
alloc = ["panweave-types/alloc"]
serde = ["dep:serde", "panweave-types/serde"]
defmt = ["dep:defmt", "panweave-types/defmt", "panweave-mac/defmt"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
panweave-types = { workspace = true }
panweave-mac = { workspace = true }
heapless = { workspace = true }
serde = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[lints]
workspace = true
