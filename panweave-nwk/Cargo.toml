[package]
name = "panweave-nwk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Panweave Zigbee stack: network layer (frames, routing, joining, tables, NWK security)"
keywords.workspace = true
categories.workspace = true

[features]
default = []
std = ["alloc", "panweave-types/std", "panweave-codec/std", "panweave-security/std", "panweave-mac/std"]
alloc = ["panweave-types/alloc", "panweave-codec/alloc"]
serde = ["dep:serde", "panweave-types/serde"]
defmt = ["dep:defmt", "heapless/defmt", "panweave-types/defmt", "panweave-codec/defmt", "panweave-security/defmt", "panweave-mac/defmt"]

[dependencies]
panweave-types = { workspace = true }
panweave-codec = { workspace = true }
panweave-security = { workspace = true }
panweave-mac = { workspace = true }
heapless = { workspace = true }
serde = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
panweave-security = { workspace = true, features = ["crypto-software"] }

[lints]
workspace = true

[[bench]]
name = "frame"
harness = false

