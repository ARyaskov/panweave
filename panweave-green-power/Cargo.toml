[package]
name = "panweave-green-power"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Panweave Zigbee stack: Green Power Basic 1.1.2 GPDF codec, GP stub security, Green Power cluster and proxy"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
std = ["alloc", "panweave-types/std", "panweave-codec/std", "panweave-mac/std", "panweave-security/std"]
alloc = ["panweave-types/alloc", "panweave-codec/alloc"]
serde = ["dep:serde", "panweave-types/serde"]
defmt = ["dep:defmt", "panweave-types/defmt", "panweave-codec/defmt", "panweave-mac/defmt", "heapless/defmt"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
panweave-types = { workspace = true }
panweave-codec = { workspace = true }
panweave-mac = { workspace = true }
panweave-security = { workspace = true }
heapless = { workspace = true }
serde = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
panweave-security = { workspace = true, features = ["crypto-software"] }

[lints]
workspace = true
