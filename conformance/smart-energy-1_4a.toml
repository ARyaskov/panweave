# Panweave conformance inventory: Smart Energy 1.4a.

document = "SE1.4a"
title = "Zigbee Smart Energy Standard 1.4a"

[[requirement]]
id = "PW-SE-PROF-001"
section = "§5.2, §5.3"
summary = "Stack profile requirements and startup attribute set (join, security, end device, link status, concentrator, APS transport/fragmentation, binding parameters)"
level = "mandatory"
status = "partially-implemented"
module = "panweave-smart-energy::profile"
tests = []
notes = "Table 5-1 startup, Table 5-2 join, Table 5-4 end-device, Table 5-6 concentrator and Table 5-8 fragmentation values are constants in panweave-smart-energy::profile; applying them to a StackConfig (a Smart Energy preset) and the binding parameters of §5.3.9 are not done (TODO(PW-SE-PROFILE))."
[[requirement]]
id = "PW-SE-SEC-001"
section = "§5.4.1–§5.4.3"
summary = "Joining with preinstalled TCLKs (install codes), rejoin policy, leaving"
level = "mandatory"
status = "not-implemented"
module = "panweave-smart-energy::security"
tests = []

[[requirement]]
id = "PW-SE-SEC-002"
section = "§5.4.4, §5.4.5"
summary = "Network key and link key update policies; key retirement"
level = "mandatory"
status = "not-implemented"
module = "panweave-smart-energy::security"
tests = []

[[requirement]]
id = "PW-SE-SEC-003"
section = "§5.4.6"
summary = "Cluster usage of security keys: APS link-key encryption mandatory for listed clusters"
level = "mandatory"
status = "requires-clarification"
module = "panweave-smart-energy"
tests = ["key_policy"]
notes = "link_key_required encodes Table 5-12 for every readable row; the rows Power Configuration, Key Establishment and Keep-Alive are unreadable in the source extraction and follow ADR-0012 (all three treated as exempt, Key Establishment necessarily so). Enforcement (Default Response FAILURE for unsecured frames of clusters that require the link key) is not wired into the ZCL dispatcher yet (TODO(PW-SE-KEYPOLICY))."
[[requirement]]
id = "PW-SE-SEC-004"
section = "§5.4.7, Annex C"
summary = "Key Establishment cluster with CBKE suites (ECMQV over sect163k1 suite 1 and sect283k1 suite 2), certificates, test vectors"
level = "mandatory"
status = "partially-implemented"
module = "panweave-smart-energy::key_establishment"
tests = ["annex_c5_suite1_transform", "annex_c6_suite2_transform", "annex_c5_exchange_between_machines", "cbke_over_the_key_establishment_cluster_installs_a_working_link_key"]
notes = "Cluster codecs (Initiate / Ephemeral Data / Confirm Key / Terminate, the KeyEstablishmentSuite attribute and suite negotiation, server and client cluster instances), Suite 1 and Suite 2 implicit certificate parsing with the C.3.1.2.3.1.2 checks, the KDF and MACU/MACV transforms (C.5 / C.6 vectors) and the initiator / responder machines are implemented; the simulator test runs the exchange over the cluster between a router and the Trust Center and proves the installed link key with an APS-secured read. The ECMQV curve arithmetic over sect163k1 / sect283k1 is supplied by the host through the Ecmqv trait (ADR-0012); the CBKE driver is application code (the test's apps), not part of the runtime, and the §5.4.7 policies (leave on UNKNOWN_ISSUER, removal of devices that never establish a key) are not enforced (TODO(PW-SE-CBKE-POLICY))."

[[requirement]]
id = "PW-SE-SEC-005"
section = "§5.4.8, §5.13"
summary = "Trust Center swap-out, keep-alive, coexistence rules"
level = "optional"
status = "not-implemented"
module = "panweave-smart-energy::security"
tests = []

[[requirement]]
id = "PW-SE-COMM-001"
section = "§5.5"
summary = "Commissioning: formation, commissioning modes, service discovery and binding"
level = "mandatory"
status = "not-implemented"
module = "panweave-smart-energy::commissioning"
tests = []

[[requirement]]
id = "PW-SE-DEV-001"
section = "§6.3"
summary = "SE device types (ESI, metering, IHD, PCT, load control, range extender, smart appliance, prepayment terminal, physical device, remote communications)"
level = "mandatory"
status = "partially-implemented"
module = "panweave-smart-energy::devices"
tests = ["device_table_and_checks"]
notes = "Table 5-13 device identifiers with the mandatory / optional server and client clusters of Tables 6-1 and 6-3 to 6-10, the prohibition of unlisted clusters and the at-least-one rules of the In-Home Display and Remote Communications Device, with an endpoint checker. The Table 6-2 features and functions (time synchronization, fragmentation support, reporting) are not verified, and no facade endpoint builders exist for the SE devices yet (TODO(PW-SE-ENDPOINTS))."
[[requirement]]
id = "PW-SE-CL-001"
section = "Annex D.2"
summary = "Demand Response and Load Control cluster"
level = "mandatory"
status = "partially-implemented"
module = "panweave-smart-energy::clusters::drlc"
tests = ["codecs_round_trip", "scheduler_accepts_supersedes_and_reports"]
notes = "Load Control Event / Cancel / Cancel All, Report Event Status (with the 42-octet signature field) and Get Scheduled Events codecs, the client attributes of Table D-7, and a client-side Scheduler applying device-class / enrollment-group filtering, expiry rejection, supersede-by-newer-event, start and duration randomization, opt-out and the cancellation rules of D.2.2.3.2. Not done: the server-side event store answering Get Scheduled Events, the ECDSA signature, the random 0-5 s report delay and binding the scheduler to a ZCL endpoint (TODO(PW-SE-DRLC-SERVER))."
[[requirement]]
id = "PW-SE-CL-002"
section = "Annex D.3"
summary = "Metering cluster"
level = "mandatory"
status = "partially-implemented"
module = "panweave-smart-energy::clusters::metering"
tests = ["formatting_and_profile"]
notes = "Mandatory Reading Information, Meter Status and Formatting attributes, the common Historical Consumption attributes, the UnitofMeasure / MeteringDeviceType / Status enumerations, the formatting and multiplier/divisor helpers and the Get Profile / Get Profile Response codecs. Mirroring, snapshots, sampling, fast poll, supply control, block and billing sets and the notification scheme are not implemented (TODO(PW-SE-METERING))."
[[requirement]]
id = "PW-SE-CL-003"
section = "Annex D.4"
summary = "Price cluster"
level = "mandatory"
status = "partially-implemented"
module = "panweave-smart-energy::clusters::price"
tests = ["publish_price_codec_and_table"]
notes = "Publish Price with every optional field (SE 1.0 short frames accepted), Get Current Price, Get Scheduled Prices and Price Acknowledgement codecs, and a client-side PriceTable applying the overlap rules of D.4.2.4.1 (newer Issuer Event ID wins; an active price cut by a later one ends when it starts). Block periods, conversion factor, calorific value, tariff information, price matrix, block thresholds, CO2, tier labels, billing periods, consolidated bills, CPP events, credit payments, currency conversion and tariff cancellation are not implemented (TODO(PW-SE-PRICE))."
[[requirement]]
id = "PW-SE-CL-004"
section = "Annex D.5"
summary = "Messaging cluster"
level = "mandatory"
status = "partially-implemented"
module = "panweave-smart-energy::clusters::messaging"
tests = ["codecs_and_display"]
notes = "Display Message / Display Protected Message / Cancel Message / Cancel All Messages and Get Last Message / Message Confirmation / GetMessageCancellation codecs (inter-PAN-only messages refused per D.5.2.3.1.1.1), and a client-side Display holding the single current message with the confirmation-status and enhanced-confirmation rules. The server-side message store and binding to a ZCL endpoint are not done (TODO(PW-SE-MESSAGING-SERVER))."
[[requirement]]
id = "PW-SE-CL-005"
section = "Annex D.6"
summary = "Tunneling cluster"
level = "optional"
status = "implemented"
module = "panweave-smart-energy::clusters::tunneling"
tests = ["request_close_and_status_codes", "data_transfer_errors_and_flow_control", "idle_tunnels_close_with_a_notification", "supported_protocols_pages"]
notes = "All D.6 commands as codecs (RequestTunnel / Response, CloseTunnel, TransferData both ways, TransferDataError, AckTransferData, ReadyData, Get Supported Tunnel Protocols / Response with 16-entry paging, TunnelClosureNotification) and a bounded server tunnel table: tunnel identifiers never reused while open, tunnels bound to the requesting device (WRONG_DEVICE otherwise), MaximumIncomingTransferSize overflow detection, the TunnelStatus codes (protocol / flow control not supported, no more identifiers), CloseTunnel by the owner only with NOT_FOUND otherwise, flow-control windows honoured by the server's own transfers, and the CloseTunnelTimeout inactivity closure with notification. The table is driven by the application (SE endpoint dispatch is not wired into the ZCL dispatcher); APS fragmentation for large transfers is the runtime's existing fragmentation."
[[requirement]]
id = "PW-SE-CL-006"
section = "Annex D.7"
summary = "Prepayment cluster"
level = "optional"
status = "partially-implemented"
module = "panweave-smart-energy::clusters::prepayment"
tests = ["command_codecs_round_trip", "response_codecs_round_trip", "account_applies_top_ups_limits_and_status", "account_tracks_debts"]
notes = "Attribute identifiers of the information, top-up (#1–#5), debt (#1–#3) and alarm sets with the PaymentControlConfiguration, CreditStatus and PrepaymentAlarmStatus bitmaps; codecs for all twelve client commands and the five server commands (Publish Prepay Snapshot with the Debt/Credit Status payload, Change Payment Mode Response, Consumer Top Up Response, Publish Top Up Log, Publish Debt Log); an Account applying the D.7 credit rules: top-ups rejected as invalid / duplicate / too large / over the maximum credit level, emergency credit setup, selection below the threshold and its end on a top-up, Credit Adjustment (incremental / absolute), Change Debt by amount type with the unchanged markers, debt collection with the accumulated debt and logs, CreditStatus per D.7.4.1. Not done: the historical cost consumption set, friendly credit periods and calendars, the start / implementation-time scheduling of pending commands and their cancellation (executed immediately by the application), top-up token (UTRN) validation (the application decides the amount), the alarm mask groups and the Mirror NOTIFICATION_PENDING behaviour (TODO(PW-SE-PREPAY-SCHEDULING))."
[[requirement]]
id = "PW-SE-CL-007"
section = "Annex D.9, D.10, D.11, D.12, D.13, D.14"
summary = "Calendar, Device Management, Events, Energy Management, MDU Pairing, Sub-GHz clusters"
level = "optional"
status = "implemented"
module = "panweave-smart-energy::clusters::calendar"
tests = ["codecs_round_trip", "store_resolves_the_day_profile_in_force", "special_day_tables_replace_and_cancel", "log_pages_most_recent_first_and_clears_where_allowed", "manage_event_applies_opt_out_rules", "duty_time_algorithm", "server_fragments_and_client_reassembles", "suspension_holds_traffic_for_the_period", "event_configuration_selectors_and_reports", "pending_changes_apply_and_cancel"]
notes = "Calendar (D.9), Device Management (D.10), Events (D.11), Energy Management (D.12, provisional), MDU Pairing (D.13, provisional) and Sub-GHz (D.14) codecs with client/server state helpers. Sub-GHz radio operation itself needs a sub-GHz PHY (requires hardware validation); the clusters are not yet wired into runtime endpoint builders (TODO(PW-SE-ENDPOINTS))."
[[requirement]]
id = "PW-SE-CL-008"
section = "Annex A.3, §6.1.6"
summary = "Keep-Alive cluster"
level = "mandatory"
status = "partially-implemented"
module = "panweave-zcl::clusters::keep_alive"
tests = ["router_keep_alive_detects_a_vanished_trust_center"]
notes = "The ZCL8 §3.18 cluster (TCKeepAliveBase / TCKeepAliveJitter server, router client behaviour with three-failure detection) is implemented; the Smart Energy Trust Center swap-out procedure that follows a lost Trust Center is not."
