# Panweave conformance inventory: Smart Energy 1.4a.

document = "SE1.4a"
title = "Zigbee Smart Energy Standard 1.4a"

[[requirement]]
id = "PW-SE-PROF-001"
section = "§5.2, §5.3"
summary = "Stack profile requirements and startup attribute set (join, security, end device, link status, concentrator, APS transport/fragmentation, binding parameters)"
level = "mandatory"
status = "implemented"
module = "panweave-smart-energy::profile"
tests = ["preset_carries_the_table_values", "profile_preset_is_applied"]
notes = "Table 5-1 startup, Table 5-2 join, Table 5-4 end-device, Table 5-6 concentrator, Table 5-8 fragmentation and Table 5-9 binding values are constants in panweave-smart-energy::profile, gathered in profile::PRESET; the facade's smart_energy_endpoints::apply_profile sets the ZDO configuration attributes and the poll rate of a StackConfig and apply_profile_to_stack sets the APS inter-frame delay, the node descriptor's maximum incoming transfer size and the concentrator radius of a coordinator. The end-device bind timeout is a constant for an application implementing End_Device_Bind_req on the coordinator."
[[requirement]]
id = "PW-SE-SEC-001"
section = "§5.4.1–§5.4.3"
summary = "Joining with preinstalled TCLKs (install codes), rejoin policy, leaving"
level = "mandatory"
status = "implemented"
module = "panweave-smart-energy::security,panweave::smart_energy_drivers::trust_center"
tests = ["registry_applies_key_usage_policies", "permit_join_broadcasts_are_bounded_and_repeated", "scan_backoff_grows_to_an_hour_and_resets_on_user_action", "the_trust_center_provisions_opens_authenticates_and_prunes"]
notes = "Install-code provisioning (CRC check, MMO-derived preconfigured key with the §5.4.8.1.2 vectors), the Trust Center registry of §5.4.1.1 with join authorization for Trust Center rejoins (§5.4.2.2), the permit-join broadcast rule of §5.4.1.2 (never 255, at most 254 s, repeated every 240 s or on a device announce), the §5.4.1 step 5 scan back-off and the §5.4.3 rule that a leave keeps the link key are implemented as policy objects. The facade SeTrustCenter driver (feature smart-energy) wires them into the runtime Trust Center: provisioning installs the install-code key as the device's provisional unique link key (with the runtime's InstallCodePolicy::Required refusing unprovisioned joiners), permit joining runs the broadcast schedule (immediately, every 240 s and on every Device_annce), DeviceAuthorized / DeviceLeft keep the registry, the Trust Center's CbkeDriver outcome authenticates the device and records its hashed key for the Table 5-10 backup, and devices that never establish a key are removed after the §5.5.5.5 grace period. Joining itself (Annex F key transport under the preconfigured key, Secure / Trust Center rejoin) is the R23 runtime's; the joiner side runs Key Establishment after joining through SeCommissioning / CbkeDriver."
[[requirement]]
id = "PW-SE-SEC-002"
section = "§5.4.4, §5.4.5"
summary = "Network key and link key update policies; key retirement"
level = "mandatory"
status = "implemented"
module = "panweave-smart-energy::security,panweave::smart_energy_drivers::trust_center,panweave-aps"
tests = ["registry_applies_key_usage_policies", "the_trust_center_provisions_opens_authenticates_and_prunes"]
notes = "Network key update (§5.4.4): the R23 runtime's Stack::update_network_key broadcasts the new key and switches after nwkNetworkBroadcastDeliveryTime; SeTrustCenter::network_key_period runs it periodically with a random key (NetworkKeyUpdated, retried a minute later while another update is in progress). Link key retirement (§5.4.5): SeTrustCenter::link_key_lifetime marks a device's CBKE key stale when it reaches the lifetime (KeyRetired; retire_key does it on demand); the APS layer (Aps::mark_key_stale) then drops data frames secured with that key without an acknowledgement and keeps processing APS commands under it, the stack reports StaleLinkKeyUsed and the driver asks the application to initiate Key Establishment (Renegotiate; the simulator test has the ESI run CbkeDriver::start), a success clearing the stale mark. Retired keys stay installed so a sleepy device can still fetch the network key with them. The lifetime and period are the application's policy (the specification leaves them to the Trust Center)."
[[requirement]]
id = "PW-SE-SEC-003"
section = "§5.4.6"
summary = "Cluster usage of security keys: APS link-key encryption mandatory for listed clusters"
level = "mandatory"
status = "requires-clarification"
module = "panweave-smart-energy"
tests = ["key_policy", "unsecured_frames_of_link_key_clusters_are_refused_with_failure"]
notes = "link_key_required encodes Table 5-12 for every readable row; the rows Power Configuration, Key Establishment and Keep-Alive are unreadable in the source extraction and follow ADR-0012 (all three treated as exempt, Key Establishment necessarily so). Enforcement is wired: Zcl::set_link_key_policy with panweave-smart-energy::zcl_link_key_policy answers an unsecured frame of a cluster that requires the link key with a Default Response FAILURE under the network key and does not process it, accepts secured frames of any cluster and answers them with the same security, and lets the FAILURE Default Response itself through; the simulator test shows all three cases between an IHD and an ESI. The three unreadable rows keep the item partial."
[[requirement]]
id = "PW-SE-SEC-004"
section = "§5.4.7, Annex C"
summary = "Key Establishment cluster with CBKE suites (ECMQV over sect163k1 suite 1 and sect283k1 suite 2), certificates, test vectors"
level = "mandatory"
status = "implemented"
module = "panweave-smart-energy::key_establishment"
tests = ["annex_c5_suite1_transform", "annex_c6_suite2_transform", "annex_c5_exchange_between_machines", "cbke_over_the_key_establishment_cluster_installs_a_working_link_key", "registry_applies_key_usage_policies", "the_driver_runs_cbke_after_joining", "the_display_leaves_a_trust_center_with_an_unknown_issuer"]
notes = "Cluster codecs (Initiate / Ephemeral Data / Confirm Key / Terminate, the KeyEstablishmentSuite attribute and suite negotiation, server and client cluster instances), Suite 1 and Suite 2 implicit certificate parsing with the C.3.1.2.3.1.2 checks, the KDF and MACU/MACV transforms (C.5 / C.6 vectors) and the initiator / responder machines are implemented; panweave::cbke::CbkeDriver drives them over the stack on both sides with the C.3.1.1 timeouts and NO_RESOURCES for a second concurrent exchange, starting after a join when asked; the simulator tests run the exchange between a router and the Trust Center and prove the installed link key with an APS-secured read. The ECMQV curve arithmetic over sect163k1 / sect283k1 is supplied by the host through the Ecmqv trait (ADR-0012). The §5.4.7 policies are in panweave-smart-energy::security and applied by the drivers: the joiner leaves on UNKNOWN_ISSUER (SeCommissioning) and retries other failures per the §5.5.5 life cycle, the Trust Center removes devices that do not establish a key within the grace period (SeTrustCenter::removal_after, TRUST_CENTER_REMOVAL_AFTER), refuses data under the preconfigured key, brokers partner keys only between CBKE-authenticated devices and answers a peer Initiate without a partner key with NO_RESOURCES."

[[requirement]]
id = "PW-SE-SEC-005"
section = "§5.4.8, §5.13"
summary = "Trust Center swap-out, keep-alive, coexistence rules"
level = "optional"
status = "implemented"
module = "panweave-smart-energy::security,panweave-runtime::keep_alive,panweave::smart_energy_drivers::commissioning"
tests = ["swap_out_procedure_walks_the_candidates", "link_key_hash_matches_table_5_11", "router_keep_alive_detects_a_vanished_trust_center", "the_display_follows_a_trust_center_swap_out"]
notes = "Keep-alive with three-failure detection is in the runtime (StackEvent::TrustCenterLost); the Table 5-11 link key hash, the Table 5-10 backup records from the registry (and their restore as unauthorized preconfigured keys) and the device-side swap-out procedure of §5.4.2.2.3.5 are implemented as a state machine emitting actions, and the R23 runtime performs the rejoin onto the replacement (Transport Key under the hashed key, apsTrustCenterAddress updated, StackEvent::TrustCenterSwapped). The facade life-cycle driver (SeCommissioning, feature smart-energy) drives it: on TrustCenterLost it rejoins (Trust Center rejoin rounds, then the secured rejoin scan for the extended PAN, then the wait on the original channel), on a detected swap-out it runs Key Establishment with the replacement with one retry before leaving and starting over, and after success rediscovers the ESIs and binds again; the simulator test swaps the ESI for a replacement restored from the hashed backup. Coexistence rules (§5.4.2.2.3.6) are the Trust Center's policy in the registry."
[[requirement]]
id = "PW-SE-COMM-001"
section = "§5.5"
summary = "Commissioning: formation, commissioning modes, service discovery and binding"
level = "mandatory"
status = "implemented"
module = "panweave-smart-energy::commissioning,panweave::smart_energy_drivers::commissioning"
tests = ["scan_schedule_follows_5_5_5_1", "joining_backs_out_and_paces_key_establishment", "steady_state_recovers_and_returns", "the_display_joins_establishes_its_key_discovers_the_esi_and_binds"]
notes = "The §5.5.5 life-cycle is a state machine (Lifecycle): the auto-join scan schedule (immediately, per minute for 15 minutes +-15 s, then hourly +-30 min), backing out of a PAN whose network key cannot be decrypted with the three-per-PAN and ten-before-rescan limits, Key Establishment retries with the fifteen-minute pause after ten failures and no leave, the leave rules of step 7 (APS Remove Device / user always, a parent's NWK leave only for end devices or unauthenticated children), rediscovery periods (3-24 h, after recovery, 60-600 s after a device announce), the 24-hour keep-alive failure limit, and rejoin-and-recovery (three rounds on the channel, scan by extended PAN ID, back to the original channel, hourly +-30 min after four failures, ended by an APS-secured Trust Center message); the ESI rules of §5.5.5.5 (one hour before removing a device without CBKE, five devices minimum) are constants and a predicate. The facade driver panweave::smart_energy_drivers::commissioning::SeCommissioning (feature smart-energy) runs it over a Stack: the scan schedule drives Stack::join (a scan without networks follows the §5.5.5.1 back-off), CBKE runs through CbkeDriver after the join, the ESIs are discovered with a broadcast Match_Desc_req for the device's client clusters on the Smart Energy profile, every discovered ESI is asked (Bind_req, after an IEEE_addr_req when its address is unknown) to bind each of those clusters to the device, steady state rediscovers periodically, TrustCenterLost (three failed keep-alives) enters rejoin and recovery (Trust Center rejoins, then a secured rejoin scan, then the wait on the original channel) and a leave resets the device. Network formation (§5.5.1) is the R23 runtime's. Not done: MDU Pairing before discovery, the APS Remove Device / user leave sources (the application feeds Left events; the driver maps the runtime's NWK leaves)."
[[requirement]]
id = "PW-SE-DEV-001"
section = "§6.3"
summary = "SE device types (ESI, metering, IHD, PCT, load control, range extender, smart appliance, prepayment terminal, physical device, remote communications)"
level = "mandatory"
status = "partially-implemented"
module = "panweave-smart-energy::devices"
tests = ["device_table_and_checks", "every_profile_cluster_of_every_device_is_instantiable", "every_device_builds_and_conforms", "rules_are_enforced"]
notes = "Table 5-13 device identifiers with the mandatory / optional server and client clusters of Tables 6-1 and 6-3 to 6-10, the prohibition of unlisted clusters and the at-least-one rules of the In-Home Display and Remote Communications Device, with an endpoint checker; panweave-smart-energy::endpoints instantiates every profile cluster with its mandatory attributes and the facade's smart_energy_endpoints (feature smart-energy) builds each device on profile 0x0109 with the common clusters, checked against the rules. Of the Table 6-2 common features and functions the stack provides joining (end devices and routers), forming (coordinator), factory-fresh reset (Node::factory_reset / Stack::erase_persisted and the Basic Reset to Factory Defaults), permit joining (SeTrustCenter::permit_join), Identify (ZCL Identify server, Zcl::set_identify_time), Match_Desc_req service discovery and its response, ZDP Bind / Unbind responses, Device_annce, and the optional inter-PAN and fragmentation (APS fragmentation) support. Not provided: the Bind Manager (End_Device_Bind_req / rsp, mandatory for the coordinator in Table 6-2) and Pair Devices (End_Device_Bind_req, optional): End_Device_Bind is deprecated in R23.2 §2.4.3.2.1 and the ZDO answers NOT_SUPPORTED (PW-R23-ZDP-020); a coordinator that must serve SE 1.4a legacy pairing needs the application-level binding manager (TODO(PW-SE-END-DEVICE-BIND))."
[[requirement]]
id = "PW-SE-CL-001"
section = "Annex D.2"
summary = "Demand Response and Load Control cluster"
level = "mandatory"
status = "implemented"
module = "panweave-smart-energy::clusters::drlc,panweave::smart_energy_drivers::drlc"
tests = ["codecs_round_trip", "scheduler_accepts_supersedes_and_reports", "annex_e_overlap_rules", "server_store_answers_get_scheduled_events", "load_control_events_are_scheduled_reported_and_cancelled"]
notes = "Load Control Event / Cancel / Cancel All, Report Event Status (with the 42-octet signature field) and Get Scheduled Events codecs, the client attributes of Table D-7, a client-side Scheduler applying device-class / enrollment-group filtering, expiry rejection, supersede-by-newer-event, start and duration randomization, opt-out, the cancellation rules of D.2.2.3.2 and the Annex E overlap rules, the 0-5 s report delay draw of D.2.3.3.1.2, and a server-side EventStore answering Get Scheduled Events per D.2.3.3.2.3 (completed events excluded, earliest end time and minimum issuer event id filters, id order or start-time order, count limit, per-client device class and enrollment group). The facade drivers (feature smart-energy) bind them to a Stack: DrlcClient takes the events from the stack, syncs the writable client attributes into the scheduler, draws the randomization and report delays from the stack's RNG, sends every Report Event Status to the issuing ESI after its delay (opt-outs and poll-driven starts / completions included) and requests scheduled events; DrlcServer issues, cancels and answers Get Scheduled Events (one Load Control Event per match, NOT_FOUND otherwise) with per-client profiles, reporting the statuses received. All frames go APS link-key protected. The ECDSA signature of Report Event Status is the host's (ADR-0012): reports carry signature type 0."
[[requirement]]
id = "PW-SE-CL-002"
section = "Annex D.3"
summary = "Metering cluster"
level = "mandatory"
status = "partially-implemented"
module = "panweave-smart-energy::clusters::metering,panweave::smart_energy_drivers::metering"
tests = ["codecs_round_trip", "fast_poll_applies_the_limits", "sampler_answers_get_sampled_data", "snapshots_are_stored_published_and_reassembled", "supply_control_applies_change_supply_rules", "mirror_table_allocates_endpoints", "profile_log_answers_get_profile", "meter_answers_profile_fast_poll_sampling_snapshot_supply_and_mirror", "attribute_set_identifiers_follow_the_tables", "supply_policy_answers_meter_events", "demand_limiting_and_flow_detection_drive_the_supply"]
notes = "Mandatory Reading Information, Meter Status and Formatting attributes, the common Historical Consumption attributes, the TOU (per-tier summations 1-48, CPP1/CPP2), Load Profile Configuration, Supply Limit, Block Information delivered / received (per tier and block), Alarms, Meter Billing, Supply Control and Alternative Historical Consumption attribute identifiers, the UnitofMeasure / MeteringDeviceType / Status enumerations, the formatting and multiplier/divisor helpers, the Get Profile / Get Profile Response codecs and a server-side ProfileLog per interval channel (newest-first blocks selected by end time, MaxNumberOfPeriodsDelivered cap, the Table D-48 statuses); clusters::metering::extended adds the codecs of every other command of Tables D-47 / D-63 (mirroring, fast poll, snapshot scheduling / taking / publishing with the TOU sub-payloads, sampling, notification schemes and flags, supply control) and the server state behind them: FastPoll with the D.3.4.2 limits, a Sampler answering GetSampledData, a Snapshots store answering GetSnapshot with offsets and fragmenting Publish Snapshot (plus a client SnapshotAssembler), SupplyControl applying Change Supply / Local Change Supply with the immediate / delayed / cancel / NOT_AUTHORIZED / UNSUP rules, SetSupplyStatus (the required status after tamper, depletion, uncontrolled flow and load limit, newer issuer event ids only), SetUncontrolledFlowThreshold (zero multiplier / divisor refused) and ResetLoadLimitCounter, with meter events applying the policy and counting load-limit events, and an ESI MirrorTable allocating mirror endpoints. The facade drivers (feature smart-energy) bind them to a Stack: MeteringServer answers Get Profile, Request Fast Poll Mode, Start Sampling / Get Sampled Data, Take Snapshot / Get Snapshot, Change Supply / Local Change Supply / Set Supply Status / Set Uncontrolled Flow Threshold / Reset Load Limit Counter (the policy mirrored into the Supply Limit and Supply Control attributes when present), and sends Request / Remove / Configure Mirror; MeteringClient issues the requests, reports the responses, assembles snapshots and hosts mirrors. All frames go APS link-key protected. Demand limiting (D.3.2.2.7.2-D.3.2.2.7.7: SupplyControl::demand_measured disconnects the supply into the load-limit state when CurrentDemandDelivered exceeds DemandLimit, counts in LoadLimitCounter and re-arms after DemandLimitArmDuration) and uncontrolled-flow detection (D.3.3.3.1.15: flow_measured raises the event after the stabilisation and measurement periods over the threshold) are the meter's own, driven by the application's measurements through MeteringServer::demand_measured / flow_measured, with endpoints::add_supply_limit carrying the attribute set. Not done: the block-tier snapshot sub-payloads, snapshot schedules triggered by the server (Schedule Snapshot is refused as unsupported) and the notification-flag predefined schemes A / B."
[[requirement]]
id = "PW-SE-CL-003"
section = "Annex D.4"
summary = "Price cluster"
level = "mandatory"
status = "implemented"
module = "panweave-smart-energy::clusters::price,panweave::smart_energy_drivers::price"
tests = ["codecs_round_trip", "scheduled_store_keeps_current_and_next", "tariff_store_assembles_and_cancels", "server_schedule_answers_current_and_scheduled", "prices_are_published_acknowledged_and_queried"]
notes = "Publish Price with every optional field (SE 1.0 short frames accepted), Get Current Price, Get Scheduled Prices and Price Acknowledgement codecs, a client-side PriceTable applying the overlap rules of D.4.2.4.1 and a server-side PriceSchedule (D.4.2.3.2 / D.4.2.3.3: the price in force, the prices ending at or after the requested start time in start order with the count limit, acknowledgements per client, expiry); clusters::price::extended adds the codecs of every optional command (block periods, conversion factor, calorific value, tariff information, price matrix and block thresholds with fragmentation, CO2 value, tier labels, billing periods, consolidated bills, CPP events and responses, credit payments, currency conversion, cancel tariff, the Get* requests), a generic Scheduled store keeping the current and next instance per tariff type with the 0xFFFFFFFF cancellation, newer-issuer-event and Get* ordering rules, and a TariffStore assembling a tariff from its fragmented parts with price lookup, block-for-consumption and CancelTariff. The facade drivers (feature smart-energy) bind the core to a Stack: PriceClient stores published prices, answers with Price Acknowledgement when required, expires prices and requests the current / scheduled prices; PriceServer publishes and answers Get Current Price (one Publish Price or NOT_FOUND), Get Scheduled Prices (one Publish Price per match) and records acknowledgements. All frames go APS link-key protected. Not done: server-side answering of the optional Get* requests (block periods, tariffs, bills ...) beyond Scheduled::scheduled, and the provisional Price client attributes."
[[requirement]]
id = "PW-SE-CL-004"
section = "Annex D.5"
summary = "Messaging cluster"
level = "mandatory"
status = "implemented"
module = "panweave-smart-energy::clusters::messaging,panweave::smart_energy_drivers::messaging"
tests = ["codecs_and_display", "server_store_answers_get_last_message_and_cancellation", "esi_messages_reach_the_display_and_are_confirmed"]
notes = "Display Message / Display Protected Message / Cancel Message / Cancel All Messages and Get Last Message / Message Confirmation / GetMessageCancellation codecs (inter-PAN-only messages refused per D.5.2.3.1.1.1), a client-side Display holding the single current message with the confirmation-status and enhanced-confirmation rules, and a server-side Server holding the current message for Get Last Message, gathering Message Confirmations per client, and keeping a pending Cancel All Messages for GetMessageCancellation until its implementation time. The facade drivers (feature smart-energy) bind them to a Stack: MessagingClient decodes the server's commands from the stack events, applies them to the Display, answers with Default Responses (MALFORMED_COMMAND, INVALID_FIELD, NOT_FOUND, INSUFFICIENT_SPACE), expires messages and scheduled cancellations on poll, and sends Get Last Message / Message Confirmation / GetMessageCancellation; MessagingServer publishes, cancels and answers Get Last Message (Display (Protected) Message or NOT_FOUND) and GetMessageCancellation, recording confirmations. All frames go APS link-key protected (Table 5-12). UTC comes from the endpoint's Time server or the driver's UtcClock."
[[requirement]]
id = "PW-SE-CL-005"
section = "Annex D.6"
summary = "Tunneling cluster"
level = "optional"
status = "implemented"
module = "panweave-smart-energy::clusters::tunneling"
tests = ["request_close_and_status_codes", "data_transfer_errors_and_flow_control", "idle_tunnels_close_with_a_notification", "supported_protocols_pages"]
notes = "All D.6 commands as codecs (RequestTunnel / Response, CloseTunnel, TransferData both ways, TransferDataError, AckTransferData, ReadyData, Get Supported Tunnel Protocols / Response with 16-entry paging, TunnelClosureNotification) and a bounded server tunnel table: tunnel identifiers never reused while open, tunnels bound to the requesting device (WRONG_DEVICE otherwise), MaximumIncomingTransferSize overflow detection, the TunnelStatus codes (protocol / flow control not supported, no more identifiers), CloseTunnel by the owner only with NOT_FOUND otherwise, flow-control windows honoured by the server's own transfers, and the CloseTunnelTimeout inactivity closure with notification. The table is driven by the application (SE endpoint dispatch is not wired into the ZCL dispatcher); APS fragmentation for large transfers is the runtime's existing fragmentation."
[[requirement]]
id = "PW-SE-CL-006"
section = "Annex D.7"
summary = "Prepayment cluster"
level = "optional"
status = "partially-implemented"
module = "panweave-smart-energy::clusters::prepayment"
tests = ["command_codecs_round_trip", "response_codecs_round_trip", "account_applies_top_ups_limits_and_status", "account_tracks_debts", "timed_commands_are_scheduled_cancelled_and_applied"]
notes = "Attribute identifiers of the information, top-up (#1–#5), debt (#1–#3) and alarm sets with the PaymentControlConfiguration, CreditStatus and PrepaymentAlarmStatus bitmaps; codecs for all twelve client commands and the five server commands; an Account applying the D.7 credit rules (top-up validation and limits, emergency credit, credit adjustment, debt changes and collections with the logs, CreditStatus per D.7.4.1); and a Pending scheduler for the timed commands (Emergency Credit Setup, Credit Adjustment, Change Payment Mode, Set Maximum Credit Limit, Set Overall Debt Cap): 0 applies now, 0xFFFFFFFF cancels by issuer event id and provider, a newer pending command replaces an older one of the same kind, due commands apply on poll. Not done: the historical cost consumption set, friendly credit periods and calendars, top-up token (UTRN) validation (the application decides the amount), the alarm mask groups and the Mirror NOTIFICATION_PENDING behaviour (TODO(PW-SE-PREPAY-CALENDAR))."
[[requirement]]
id = "PW-SE-CL-007"
section = "Annex D.9, D.10, D.11, D.12, D.13, D.14"
summary = "Calendar, Device Management, Events, Energy Management, MDU Pairing, Sub-GHz clusters"
level = "optional"
status = "implemented"
module = "panweave-smart-energy::clusters::calendar"
tests = ["codecs_round_trip", "store_resolves_the_day_profile_in_force", "special_day_tables_replace_and_cancel", "log_pages_most_recent_first_and_clears_where_allowed", "manage_event_applies_opt_out_rules", "duty_time_algorithm", "server_fragments_and_client_reassembles", "suspension_holds_traffic_for_the_period", "event_configuration_selectors_and_reports", "pending_changes_apply_and_cancel"]
notes = "Calendar (D.9), Device Management (D.10), Events (D.11), Energy Management (D.12, provisional), MDU Pairing (D.13, provisional) and Sub-GHz (D.14) codecs with client/server state helpers, instantiable on Smart Energy endpoints through panweave-smart-energy::endpoints. Sub-GHz radio operation itself needs a sub-GHz PHY (requires hardware validation); command dispatch to the state helpers is the application's."
[[requirement]]
id = "PW-SE-CL-008"
section = "Annex A.3, §6.1.6"
summary = "Keep-Alive cluster"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::keep_alive,panweave-runtime::keep_alive,panweave::smart_energy_drivers::commissioning"
tests = ["router_keep_alive_detects_a_vanished_trust_center", "the_display_follows_a_trust_center_swap_out"]
notes = "The ZCL8 §3.18 cluster (TCKeepAliveBase / TCKeepAliveJitter server, router client behaviour with three-failure detection) is implemented in the runtime; the Smart Energy reaction to a lost Trust Center — rejoin and recovery and the swap-out procedure with Key Establishment against the replacement — is driven by the facade SeCommissioning driver."
[[requirement]]
id = "PW-SE-CL-009"
section = "Annex B"
summary = "Enhanced inter-PAN transmission"
level = "optional"
status = "requires-hardware-validation"
module = "panweave-smart-energy::interpan"
tests = ["security_policy_follows_annex_b", "survey_keeps_the_best_beacon_per_device", "secured_frames_round_trip_between_link_key_holders"]
notes = "The stub APS header carries the Security / ACK Request (APS counter) / Extended Header bits of Figure B-7, group delivery uses 0b11, and panweave-aps::interpan::secure / unsecure protect a frame with the APS link key of the partner (extended nonce, replay refused). The SE policy of B.4 / B.8 (every cluster secured except Key Establishment, non-conforming frames dropped) and the B.6 channel-survey candidate list are in panweave-smart-energy::interpan. The exempt cluster is taken as 0x0800 and the authenticated data starts at the APS frame control (ADR-0013); both await a captured frame from another implementation. The runtime dispatches only touchlink inter-PAN frames; SE clusters over inter-PAN are driven by the application through the MAC service (TODO(PW-SE-INTERPAN-RUNTIME))."
[[requirement]]
id = "PW-SE-EV-001"
section = "Annex E"
summary = "Overlapping DRLC event rules"
level = "mandatory"
status = "implemented"
module = "panweave-smart-energy::clusters::drlc"
tests = ["annex_e_overlap_rules", "scheduler_accepts_supersedes_and_reports"]
notes = "Scheduler applies rules 3 (expired events rejected 0xFB), 4 (start in the past runs from now with the original end), 5a/5b (newer overlapping events supersede; a running event keeps its state until the successor's effective start and switches directly, reported Superseded once), 6b/6d (overlap judged on scheduled periods so randomization never conflicts; a successive event's effective start truncates or extends the predecessor's effective end, no artificial gap) and 8 (supersession only when the new event covers every device class of the previous one that this device has). Rules 1, 2 and 7 bind the ESI / upstream systems and need no client code."
