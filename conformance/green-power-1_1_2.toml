# Panweave conformance inventory: Green Power Basic v1.1.2 (14-0563-19).

document = "GP1.1.2"
title = "Green Power feature specification, Basic functionality set, v1.1.2"

[[requirement]]
id = "PW-GP-FRAME-001"
section = "A.1.4.1"
summary = "GPDF: 802.15.4 MAC header, NWK frame control (frame type, protocol version 3, auto-commissioning, NWK FC extension), extended NWK frame control (application id, security level, security key, rx-after-tx, direction), GPD SrcID or IEEE+endpoint, security frame counter, command id, payload, MIC"
level = "mandatory"
status = "implemented"
module = "panweave-green-power::gpdf"
tests = ["parses_the_level_2_test_vector", "unsecured_and_maintenance_frames", "ieee_identity_comes_from_the_mac_header"]
notes = "NWK Frame Control (protocol version 3, frame type, auto-commissioning, extension), Extended NWK Frame Control (ApplicationID 0b000 / 0b010, security level, key, RxAfterTx, direction), SrcID or IEEE + endpoint from the MAC header, frame counter, payload and MIC; the reserved level 0b01, LPED and reserved ApplicationIDs and RxAfterTx + Auto-Commissioning are rejected; parsed against the §A.1.5.4 vectors."
[[requirement]]
id = "PW-GP-FRAME-002"
section = "A.1.4.2"
summary = "Frame types: data and maintenance (channel request/configuration)"
level = "mandatory"
status = "implemented"
module = "panweave-green-power::gpdf"
tests = ["unsecured_and_maintenance_frames", "commissioning_mode_forwards_commissioning_frames"]
notes = "Data and Maintenance frame types; Maintenance frames carry no addressing, extension or security fields."
[[requirement]]
id = "PW-GP-SEC-001"
section = "A.1.5.3–A.1.5.12, R23.2 Annex H"
summary = "GP stub security: security levels 0/2/3, nonce construction per application id, key types (shared/individual, derived from GPD key with AES-MMO/CCM), TC-LK protected key transport, frame counter freshness; test vectors"
level = "mandatory"
status = "implemented"
module = "panweave-green-power::security"
tests = ["nonce_vectors", "level_2_and_3_vectors_from_the_gpd", "bidirectional_vectors", "key_derivation_vectors", "tc_lk_protection_vectors"]
notes = "CCM* with M = 4 over the GP stub header (levels 0b10 / 0b11, both directions, both ApplicationIDs), the nonce of §A.1.5.3.2, HMAC-MMO derivation of the NWK-key derived group key and of individual keys, TC-LK protection of GPD keys for the Commissioning and Commissioning Reply GPDFs; every vector of §A.1.5.4–§A.1.5.8 is a test. Freshness is enforced by the proxy against the Proxy Table counter."
[[requirement]]
id = "PW-GP-GPD-001"
section = "A.1.6, A.4"
summary = "GPD addressing (reserved SrcIDs, application ids 0b000/0b010), bidirectional operation, GPD command ids (switch, sensor, level, color, scenes, commissioning, decommissioning, channel request, success, manufacturer specific)"
level = "mandatory"
status = "partially-implemented"
module = "panweave-green-power::command"
tests = ["gpd_id_ranges", "commissioning_command_round_trips", "commissioning_reply_and_channel_commands"]
notes = "GPD identities (SrcID ranges, IEEE + endpoint with the 0x00 / 0xff rules), the GPD command identifiers of Tables 54-56 with the commissioning / to-GPD range helpers, and the payload codecs of the commissioning commands (GPD Commissioning with Extended Options, TC-LK protected key + MIC, outgoing counter and Application information incl. cluster list and switch information; Commissioning Reply; Channel Request; Channel Configuration). Application Description (0xE4) and the sensor / bidirectional operation command payloads are not decoded (forwarded opaquely)."
[[requirement]]
id = "PW-GP-CL-001"
section = "A.3.3, A.3.4"
summary = "Green Power cluster 0x0021 server (sink) and client (proxy) attributes and commands: GP Notification, GP Pairing Search, GP Tunneling Stop, GP Commissioning Notification, GP Sink Commissioning Mode, GP Translation Table Update/Request/Response, GP Pairing Configuration, GP Sink Table Request/Response, GP Proxy Table Request/Response, GP Notification Response, GP Pairing, GP Proxy Commissioning Mode, GP Response"
level = "mandatory"
status = "partially-implemented"
module = "panweave-green-power::cluster"
tests = ["notification_round_trip", "commissioning_notification_with_failed_security", "pairing_forms", "commissioning_mode_and_table_request", "sink_commissioning_mode_and_response", "sink_entry_round_trips_in_every_mode", "table_lookup_follows_the_endpoint_rules"]
notes = "Client (proxy) and server (sink) attribute identifiers, the Basic Proxy gppFunctionality and Basic Sink gpsFunctionality, gpsSecurityLevel / gpsCommissioningExitMode forms; codecs for GP Notification, GP Commissioning Notification (ADR-0011), GP Pairing, GP Proxy Commissioning Mode, GP Sink Commissioning Mode, GP Response, GP Proxy / Sink Table Request and Response and the Proxy Table / Sink Table entry OTA formats. GP Notification Response, GP Pairing Search, GP Tunneling Stop, GP Pairing Configuration and the Translation Table commands are not implemented."
[[requirement]]
id = "PW-GP-PROXY-001"
section = "A.3.2.8, A.3.6.3, A.3.8.1"
summary = "Proxy basic: proxy table, receive GPDF, duplicate filter, security check per proxy table entry, tunnel as GP Notification (unicast/groupcast/derived group, with alias), commissioning mode entered via GP Proxy Commissioning Mode, forward commissioning frames as GP Commissioning Notification"
level = "mandatory"
status = "partially-implemented"
module = "panweave-green-power::proxy"
tests = ["unsecured_gpdf_is_tunnelled_to_every_paired_sink", "secured_gpdf_needs_matching_security_and_freshness", "commissioning_mode_forwards_commissioning_frames", "proxy_table_request_by_index_and_by_gpd", "router_proxy_tunnels_gpdfs_to_the_sink", "gp_response_appoints_the_selected_sender"]
notes = "Basic Proxy: Proxy Table maintained from GP Pairing (add / remove sink, RemoveGPD, level 0b01 refusal, INVALID_FIELD / INSUFFICIENT_SPACE Default Responses for unicast requests), duplicate filter (gpDuplicateTimeout), level / key-type match and freshness check, key recovery per §A.3.7.3.1.4, GP Notification to lightweight unicast sinks (no alias, Dmin), derived groupcast (DGroupID, entry alias, MAC sequence) and commissioned groups (group alias, sequence - 9), commissioning mode with window / exit conditions / unicast originator, GP Commissioning Notification (alias sequence - 12, SecurityProcessingFailed with MIC) including Channel Requests, GP Proxy Table Response, GP Response with the gpTxQueue of the SelectedSender (one entry, transmitted gpTxOffset after the GPD's receive window, FirstToForward). The runtime (feature green-power) feeds protocol-version-3 MAC frames to the stub, registers the Green Power EndPoint, tunnels with NWK/APS aliasing after the delay, transmits the queued GPDFs and persists the Proxy Table. gppBlockedGPDID, Proxy Table maintenance (search counter, GP Pairing Search), Device_annce on alias conflicts, the SelectedSender channel switch and bidirectional operation in operational mode (GP Notification Response, GP Tunneling Stop) are not implemented."
[[requirement]]
id = "PW-GP-SINK-001"
section = "A.3.2.9, A.3.6.2, A.3.8.2"
summary = "Sink (combo basic): sink table, commissioning (unidirectional and bidirectional), key derivation/delivery, GP Pairing distribution to proxies, translation of GPD commands to ZCL, security and freshness checks"
level = "conditional"
status = "implemented"
module = "panweave-green-power::sink"
tests = ["unidirectional_commissioning_with_a_protected_oob_key", "bidirectional_commissioning_hands_out_the_derived_group_key", "multi_hop_commissioning_through_a_proxy", "direct_channel_request_and_sink_table_request", "generic_translation_table", "combo_sink_commissions_a_gpd_through_a_proxy_and_runs_its_commands"]
notes = "Sans-I/O Basic Combo sink: Sink Table (ADR-0016), commissioning mode (local request or GP Sink Commissioning Mode, window, exit on first pairing, GP Proxy Commissioning Mode to the proxies), unidirectional and bidirectional commissioning from direct GPDFs and GP Commissioning Notifications (gpsSecurityLevel checks, TC-LK protected OOB keys, key delivery in the Commissioning Reply as gpTxQueue GPDF or GP Response to the proxy, Success verification incl. SecurityProcessingFailed notifications, counter reset rule), Data GPDF with Auto-Commissioning, GP Pairing generation, Decommissioning, operation from direct GPDFs and GP Notifications (duplicate filter, level / key-type match, freshness, wrong-mode corrections), Channel Request answered directly or via GP Response, GP Sink Table Request / Response, generic GPD-to-ZCL translation of Tables 54 / 55. Runtime: Stack::enable_green_power_sink registers endpoint 242 as GP Combo Basic (server attributes of Table 24 read-only), green_power_commission / green_power_stop_commissioning, alias Device_annce, derived / commissioned group membership of endpoint 242, translated commands executed on the paired local endpoints as if from the alias, GreenPowerPaired / Decommissioned / Refused / Command events, Sink Table persisted (Kind::GreenPower ids 0x100+). Not implemented: GP Pairing Configuration, Application Description (0xE4) / Translation Table, Sink Table-based groupcast forwarding, the SinkTable attribute over Read Attributes (use GP Sink Table Request), sink-side channel hopping for direct Channel Requests (ADR-0016); gpTxOffset timing needs hardware validation."
[[requirement]]
id = "PW-GP-COMM-001"
section = "A.3.9"
summary = "Commissioning procedure: sink commissioning mode window, proxy commissioning window, channel request handling, commissioning reply, success"
level = "mandatory"
status = "partially-implemented"
module = "panweave-green-power::sink"
tests = ["commissioning_mode_forwards_commissioning_frames", "router_proxy_tunnels_gpdfs_to_the_sink", "multi_hop_commissioning_through_a_proxy", "bidirectional_commissioning_hands_out_the_derived_group_key", "combo_sink_commissions_a_gpd_through_a_proxy_and_runs_its_commands", "gp_response_appoints_the_selected_sender", "bidirectional_commissioning_through_a_proxy_delivers_the_key"]
notes = "Proxy side: GP Proxy Commissioning Mode enters / exits the window (default 180 s, overridable), Channel Request and Commissioning / Success / Decommissioning GPDFs are forwarded as GP Commissioning Notifications (broadcast with derived alias or unicast to the originator); GP Response appoints the SelectedSender, whose gpTxQueue answers the GPD's next receive window (RxAfterTx frame or Channel Request without Auto-Commissioning) gpTxOffset later, the others drop their entry (steps 8, 9, 14). Sink side (panweave-green-power::sink): commissioning window with exit modes, GP Proxy Commissioning Mode to the proxies, Channel Request answered with Channel Configuration (directly after gpTxOffset, or GP Response appointing the proxy on the GPD's next channel), Commissioning with the gpsSecurityLevel policy, Commissioning Reply delivered from the sink's gpTxQueue or by GP Response, Success finalising the pairing, GP Pairing and Device_annce. Not implemented: the SelectedSender's 5 s switch to the GPD's announced channel (steps 8-9): a frame appointed for another channel is dropped (TODO(PW-GP-CHANNEL)); GPDs whose channel search ends on the operational channel are served."
[[requirement]]
id = "PW-GP-EP-001"
section = "A.2.4, A.2.5"
summary = "Green Power endpoint 242 with profile 0xA1E0; proxy alias addressing"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::green_power"
tests = ["router_proxy_tunnels_gpdfs_to_the_sink", "combo_sink_commissions_a_gpd_through_a_proxy_and_runs_its_commands"]
notes = "Stack::enable_green_power_proxy registers endpoint 242 (profile 0xA1E0, device GP Proxy Basic 0x0061) with the Green Power cluster client; enable_green_power_sink registers it as GP Combo Basic (0x0066) with server and client. Notifications are sent from it with UseAlias (NWK source / sequence and APS counter = alias, §A.3.6.3.3); the sink's Device_annce on behalf of a GPD uses the alias with NWK sequence and APS counter 0x00 (§A.3.6.3.4.2); aliased broadcasts are keyed by the alias in the broadcast transaction table."
