# ---------------------------------------------------------------- APS

[[requirement]]
id = "PW-R23-APS-001"
section = "§2.2.5.1"
summary = "APS frame header: frame control (frame type, delivery mode, ack format, security, ack request, extended header), destination endpoint, group address, cluster id, profile id, source endpoint, APS counter, extended header (fragmentation, block number, ack bitfield)"
level = "mandatory"
status = "implemented"
module = "panweave-aps::frame"
tests = ["data_header_round_trip", "group_header_round_trip", "command_and_ack_headers", "fragmented_headers", "malformed_headers_are_rejected"]

[[requirement]]
id = "PW-R23-APS-002"
section = "§2.2.5.2"
summary = "Data, command and acknowledgement frame layouts"
level = "mandatory"
status = "implemented"
module = "panweave-aps::frame"
tests = ["data_header_round_trip", "command_and_ack_headers"]

[[requirement]]
id = "PW-R23-APS-003"
section = "§2.2.7"
summary = "APS constants and AIB attributes (ack wait duration, max frame retries, fragmentation parameters, binding/group tables, interframe delay, max window size)"
level = "mandatory"
status = "implemented"
module = "panweave-aps::aib"
tests = ["fragmented_asdu_is_reassembled", "lost_acknowledgements_trigger_retries_then_no_ack"]
notes = "Constants of Table 2-23 and scalar attributes of Tables 2-24/4-35; the statistics table (Table 2-26) and the fragmentation cache (Table 2-27) are not implemented (window size 1 needs no per-peer parameters)."
[[requirement]]
id = "PW-R23-APS-004"
section = "§2.2.8.4.2"
summary = "Reliable unicast: APS ack request, retransmission up to apscMaxFrameRetries with apscAckWaitDuration, confirm with status"
level = "mandatory"
status = "implemented"
module = "panweave-aps::layer::tx"
tests = ["acked_unicast_is_delivered_once_and_confirmed", "lost_acknowledgements_trigger_retries_then_no_ack"]
notes = "Retransmissions of APS-secured frames use a fresh frame counter; NWK failures of acknowledged frames are retried like a lost acknowledgement."
[[requirement]]
id = "PW-R23-APS-005"
section = "§2.2.8.4.5"
summary = "Fragmentation and reassembly: block numbers, window size, ack bitfield, interframe delay, reassembly timeout, per-transaction state"
level = "conditional"
status = "partially-implemented"
module = "panweave-aps::layer"
tests = ["fragmented_asdu_is_reassembled", "fragment_loss_is_recovered_by_retransmission"]
notes = "Window size 1 only (the sole interoperable value); the receiver accepts blocks in order and acknowledges every block; window sizes greater than 1 and the fragmentation cache / Node Descriptor discovery of peer support (§2.2.8.4.5.1) are not implemented."
[[requirement]]
id = "PW-R23-APS-006"
section = "§2.2.8.4.3"
summary = "Duplicate rejection using source address + APS counter within apsDuplicateRejectionTimeout"
level = "mandatory"
status = "implemented"
module = "panweave-aps::tables"
tests = ["duplicate_rejection_expiry_and_eviction", "acked_unicast_is_delivered_once_and_confirmed"]
notes = "Entry lifetime is apscAckWaitDuration x (1 + apscMaxFrameRetries); frames tunnelled to an unauthorized device bypass the table (§4.6.3.7.3)."
[[requirement]]
id = "PW-R23-APS-007"
section = "§2.2.8.2, §2.2.8.3"
summary = "Binding table and indirect (bound) transmission to unicast/group destinations; group table membership and group delivery to endpoints"
level = "mandatory"
status = "implemented"
module = "panweave-aps::tables"
tests = ["binding_table_bind_unbind", "group_table_membership", "group_delivery_and_loopback", "bound_transmission_fans_out"]

[[requirement]]
id = "PW-R23-APS-008"
section = "§2.2.4.2"
summary = "APSME management: bind/unbind, add/remove group, get/set AIB"
level = "mandatory"
status = "partially-implemented"
module = "panweave-aps::tables"
tests = ["binding_table_bind_unbind", "group_table_membership"]
notes = "Bind/unbind and group add/remove are table operations; APSME-GET/SET are direct field access on Aib. The ZDO front-ends (Bind_req etc.) belong to panweave-zdo."
[[requirement]]
id = "PW-R23-APS-009"
section = "§2.2.9"
summary = "APS status values"
level = "mandatory"
status = "implemented"
module = "panweave-types::status"
tests = ["data_header_round_trip"]

[[requirement]]
id = "PW-R23-APS-010"
section = "Annex G"
summary = "Inter-PAN transmission and reception with stub NWK header and inter-PAN APS header"
level = "optional"
status = "not-implemented"
module = "panweave-aps::interpan"
tests = []

[[requirement]]
id = "PW-R23-APS-011"
section = "§2.2.8.1"
summary = "APS persistent data: binding table, group table, designated coordinator, channel mask list, use extended PAN ID, use insecure join, descriptors, network manager address survive reset"
level = "mandatory"
status = "partially-implemented"
module = "panweave-runtime::persist"
tests = ["end_device_and_coordinator_survive_reboots"]
notes = "Binding and group tables and the network manager address are persisted and restored; descriptors are compile-time application data re-registered on boot; apsDesignatedCoordinator, apsChannelMaskList, apsUseExtendedPANID and apsUseInsecureJoin are StackConfig values supplied by the application rather than stored."

[[requirement]]
id = "PW-R23-SEC-032"
section = "§4.4.12.1"
summary = "Persistence of security-related AIB values: apsTrustCenterAddress and every apsDeviceKeyPairSet entry are stored across reboot; IncomingFrameCounter, Timeout and VerifiedFrameCounter are not persisted"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::persist"
tests = ["end_device_and_coordinator_survive_reboots"]
notes = "The outgoing frame counter of each entry is restored from its last persisted reservation bound so that values are never reused; the incoming counter is stored for freshness after reboot but reset by the peer's key verification as usual. The record set is indexed from the AIB record because the Storage trait has no enumeration."

[[requirement]]
id = "PW-R23-SEC-033"
section = "§4.6.3.8, §2.4.3.4.8, §2.4.4.4.8"
summary = "APS frame counter verification: VerifiedFrameCounter per key-pair entry (false after reboot), UNVERIFIED_FRAME_COUNTER drops the frame and triggers Security_Challenge_req; challenge key/nonce derivation and CCM MIC-64 over the response TLV; response validation sets the incoming counter and marks it verified"
level = "mandatory"
status = "implemented"
module = "panweave-security::challenge"
tests = ["key_derivation_matches_the_worked_example", "mic_depends_on_every_input", "rebooted_trust_center_synchronizes_frame_counters"]
notes = "One outstanding challenge at a time (apsChallengeTargetEui64 / apsChallengeValue), rate limited by apsChallengePeriodTimeoutSeconds; the frame counter synchronization capability is advertised in the Link-Key Features TLV of the Trust Center link key transport and assumed for negotiating partners. The Security_Challenge_rsp carries a status octet (ADR-0009)."

[[requirement]]
id = "PW-R23-NWK-068"
section = "§3.6.10.7, §3.6.10.8"
summary = "Parent routers persist end-device neighbor entries and give every child a full timeout period after reboot; end devices should send a keep-alive immediately after reboot"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::persist"
tests = ["end_device_and_coordinator_survive_reboots"]
notes = "Restored children start with timeout counter = device timeout. A rebooted end device performs a secured rejoin, which doubles as the initial keep-alive."

