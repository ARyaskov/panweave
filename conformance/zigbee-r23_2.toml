[[requirement]]
id = "PW-R23-SEC-018"
section = "§4.6.3.2"
summary = "Joining device authentication: after MAC association receive Transport Key (network key) protected with pre-configured/derived link key; start authentication timer; leave on failure"
level = "mandatory"
status = "implemented"
module = "panweave-aps::layer::cmd"
tests = ["trust_center_join_and_link_key_update", "unauthorized_joiner_ignores_data_and_unencrypted_key", "coordinator_and_end_device_full_stack"]
notes = "The joiner learns apsTrustCenterAddress from the Transport Key source and renames its pre-installed key entry; unencrypted transport keys are refused while unauthorized when requireLinkKeyEncryptionForApsTransportKey is set. Forwarding of an APS-encrypted Transport Key by a parent without the Tunnel command (UseParent without TunnelCommand) is not supported because the parent cannot decrypt it; see docs/adr."
[[requirement]]
id = "PW-R23-SEC-019"
section = "§4.6.3.2, §4.7"
summary = "Trust Center handling of Update Device: apply policy (allow joins, install code requirement, rejoin policy), send Transport Key (tunnelled via parent when joiner is not a neighbor), start TCLK exchange timer, Remove Device on rejection"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::pump"
tests = ["trust_center_join_and_link_key_update", "coordinator_and_end_device_full_stack", "router_and_sleepy_end_device_with_router_failure"]
notes = "The runtime evaluates TrustCenterPolicy on join indications and Update Device, creates the well-known key entry when required, sends the network key directly to neighbour joiners or tunnelled through the parent, and authenticates the child once the Transport Key is confirmed. Removal on rejection uses NLME-LEAVE."
[[requirement]]
id = "PW-R23-SEC-020"
section = "§4.6.3.4"
summary = "Network key update: TC broadcasts new key via Transport Key (nwkKeyType alternate), then Switch Key after nwkNetworkBroadcastDeliveryTime; devices store alternate key and switch on Switch Key; frame counters reset"
level = "mandatory"
status = "partially-implemented"
module = "panweave-aps::layer::cmd"
tests = ["unauthorized_joiner_ignores_data_and_unencrypted_key"]
notes = "Broadcast Transport Key (alternate key) and Switch Key are implemented; the broadcast delivery timer between them and the unicast-to-sleepy-children repetition (§4.4.2.3 last paragraph) are left to the runtime."
[[requirement]]
id = "PW-R23-SEC-021"
section = "§4.4.5, §4.6.3.4.2"
summary = "Network key recovery: after Switch Key with unknown sequence number, request via Request Key"
level = "mandatory"
status = "not-applicable"
module = "panweave-security::procedures::key_update"
tests = []
notes = "R23.2 defines Request Key only for Trust Center (0x04) and application (0x02) link keys; a Switch Key naming an unknown sequence number is ignored (Nwk::switch_network_key returns false) and a device that lost the network key recovers through a Trust Center rejoin (BDB 3.1 §10.1, implemented in panweave-bdb)."
[[requirement]]
id = "PW-R23-SEC-022"
section = "§4.6.3.6"
summary = "Device leave: TC sends Remove Device to parent, parent issues NWK Leave; device leaving reports Update Device (device left)"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::pump"
tests = ["trust_center_removes_a_device_through_its_parent"]
notes = "Stack::remove_device issues a NWK Leave to a direct child or an APS Remove Device to the parent; a router accepts Remove Device from the Trust Center for itself or a child, reports departed children with Update Device (Device Left) — on the child's own leave announcement and after a requested leave was confirmed (an end device told to leave by its parent sends no announcement, §3.6.1.11.3.1) — and the Trust Center surfaces DeviceLeft to the application."
[[requirement]]
id = "PW-R23-SEC-023"
section = "§4.7.1, §4.7.3"
summary = "Trust Center policies: allowJoins, allowRejoins, allowTrustCenterLinkKeyRequests, allowApplicationKeyRequests, useWhiteList/joining list, requireInstallCodesOrPresetPassphrase, allowRemoteTcPolicyChange, network key update method/period, allowVirtualDevices"
level = "mandatory"
status = "implemented"
module = "panweave-security::trust_center"
tests = ["unsecured_join_policy", "key_negotiation_join_policy", "rejoin_policy", "tclk_request_policy", "app_key_and_remote_policy"]

[[requirement]]
id = "PW-R23-SEC-024"
section = "§4.7.2, §4.9.3, §4.9.4"
summary = "Trust Center link keys: well-known global key, install-code derived keys, unique TCLK per device, key attributes provisional/unverified/verified, Verify Key / Confirm Key exchange after receiving a new TCLK"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::pump"
tests = ["trust_center_join_and_link_key_update", "coordinator_and_end_device_full_stack"]
notes = "Well-known global key entries, unique per-device keys generated by the Trust Center on Request Key, verify/confirm transitions provisional -> unverified -> verified. Install-code derived keys are supported by the key material (link_key_from_install_code) but the TC-side install-code provisioning API is still to be exposed."
[[requirement]]
id = "PW-R23-SEC-025"
section = "§4.4.9, §4.9.6, Annex J"
summary = "Dynamic Link Key negotiation: ECDHE (Curve25519) with SPEKE using passphrase or well-known passphrase, AES-MMO based KDF, key confirmation; results in unverified TCLK"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::dlk"
tests = ["annex_c7_1_1_well_known_psk_vector", "annex_c7_1_2_passphrase_vector_generator", "non_contributory_points_are_rejected", "random_ephemerals_agree", "anonymous_key_negotiation_join_through_router", "install_code_authenticated_negotiation", "wrong_passphrase_fails_and_restores_the_entry"]
notes = "Dynamic Key Negotiation Joining end to end (Start_Key_Update → Start_Key_Negotiation via Relay Message → Verify / Confirm Key → Transport Key) with anonymous and install-code secrets, entry backup/restore and apsSecurityTimeOutPeriod deadlines; on-network TCLK re-negotiation after Node_Desc_rsp (BDB §7.2) is not implemented (Request Key is used after a symmetric join). The dlk feature enables Curve25519."

[[requirement]]
id = "PW-R23-SEC-026"
section = "§4.9.7"
summary = "Passphrase update after joining via Security_Set_Configuration / symmetric passphrase TLV"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::dlk"
tests = ["anonymous_key_negotiation_join_through_router"]
notes = "Passphrase obtained with Security_Retrieve_Authentication_Token after a negotiated join; Security_Set_Configuration does not carry a passphrase in R23.2 (the symmetric passphrase TLV is only used in the token response)."
[[requirement]]
id = "PW-R23-SEC-027"
section = "§4.8"
summary = "Distributed security network: TC address 0xFFFF…FF, router issues network key on join, distributed global link key usage"
level = "mandatory"
status = "partially-implemented"
module = "panweave-aps::layer::cmd"
tests = []
notes = "Distributed-network Transport Key source 0xFFFF...FF handling and apsTrustCenterAddress semantics are implemented in the APS; the router-side issue of the network key on join is wired by the runtime."
[[requirement]]
id = "PW-R23-SEC-028"
section = "§4.7.4"
summary = "Trust Center swap-out procedure"
level = "optional"
status = "not-implemented"
module = "panweave-security::trust_center::swap_out"
tests = []

[[requirement]]
id = "PW-R23-SEC-029"
section = "§4.9.1"
summary = "Joining device policies: preconfigured key type, TCLK requirement, behaviour on failed TCLK exchange"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::dlk"
tests = ["wrong_passphrase_fails_and_restores_the_entry", "install_code_authenticated_negotiation"]
notes = "Preconfigured key type is StackConfig::preconfigured_link_key; a failed or timed-out negotiation restores the previous key-pair entry (§4.4.9) and the joiner leaves after apsSecurityTimeOutPeriod without a network key."
[[requirement]]
id = "PW-R23-SEC-030"
section = "Annex C"
