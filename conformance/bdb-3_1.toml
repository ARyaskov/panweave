# Panweave conformance inventory: PRO Base Device Behavior v3.1 (22-65816-030).

document = "BDB3.1"
title = "PRO Base Device Behavior Specification v3.1"

[[requirement]]
id = "PW-BDB-CFG-001"
section = "§5.1–§5.7"
summary = "BDB constants (primary/secondary channel masks, scan durations, TCLK exchange attempts, min commissioning time, touchlink constants) and attributes (bdbNodeIsOnANetwork, bdbCommissioningMode, bdbCommissioningStatus, bdbJoiningNodeEui64, bdbNodeJoinLinkKeyType, bdbTCLinkKeyExchangeMethod, bdbTrustCenterRequireKeyExchange, join policy, node configuration)"
level = "mandatory"
status = "implemented"
module = "panweave-bdb"
tests = ["formation_falls_back_to_secondary_list", "steering_retries_then_secondary_then_opens_network"]
notes = "Config (bdbcf* attributes, node policies) with the 2.4 GHz defaults of Tables 4–7 and 10; constants of Tables 1–3; bdbgNodeIsOnANetwork kept by the machine. Sub-GHz defaults are not provided."
[[requirement]]
id = "PW-BDB-POL-001"
section = "§6.1, §6.2"
summary = "Logical device types and centralized/distributed security models; coordinator forms centralized, router may form distributed"
level = "mandatory"
status = "implemented"
module = "panweave-bdb"
tests = ["formation_falls_back_to_secondary_list", "bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Formation refused for end devices; coordinators form centralized and routers distributed networks through StackConfig::distributed."
[[requirement]]
id = "PW-BDB-POL-002"
section = "§6.3"
summary = "Commissioning mode bitmask (touchlink, steering, formation, finding & binding) processed in the specified order; commissioning status reporting"
level = "mandatory"
status = "not-applicable"
module = "panweave-bdb"
tests = []
notes = "BDB 3.1 no longer defines the bdbCommissioningMode bitmask / bdbCommissioningStatus attribute of BDB 3.0; procedures are invoked individually and report an Outcome."
[[requirement]]
id = "PW-BDB-POL-003"
section = "§6.4"
summary = "Minimum requirements: mandatory ZDO services, identify cluster, groups where required, APS ack usage, node descriptor fields, stack compliance revision"
level = "mandatory"
status = "implemented"
module = "panweave-runtime"
tests = ["bdb_formation_steering_finding_binding_and_rejoin", "router_keep_alive_detects_a_vanished_trust_center"]
notes = "Profile 0x0104, Identify client for initiators, Groups server with the group table, simple descriptors per endpoint, stack compliance revision 23; the Trust Center's Keep-Alive server and Poll Control client are provided by panweave::endpoints::trust_center_utility and routers run the keep-alive client of ZCL8 §3.18.4 (Match_Desc discovery, APS-encrypted reads, TrustCenterLost after three failures)."
[[requirement]]
id = "PW-BDB-POL-004"
section = "§6.5"
summary = "Default reporting configuration for reportable attributes"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::attribute"
tests = ["reporting_configuration_and_reports", "reset_to_factory_defaults_restores_attributes_and_reporting"]
notes = "DefaultReporting installed at instance creation (OnOff: change-based plus 300 s; CurrentLevel: 1 s minimum, 300 s, change 1) and restored by Reset to Factory Defaults; reports go to bound destinations without further configuration and a Configure Reporting overrides it."
[[requirement]]
id = "PW-BDB-POL-005"
section = "§6.6"
summary = "MAC data polling: end devices poll parent at least at the specified rate; fast polling after transmissions"
level = "mandatory"
status = "partially-implemented"
module = "panweave-runtime::stack"
tests = ["router_and_sleepy_end_device_with_router_failure"]
notes = "Sleepy end devices poll at a configurable base rate (default 3 s) and burst fast polls after each transmission and while waiting for the network key; the exact BDB rate constants and Poll Control cluster integration are not implemented."
[[requirement]]
id = "PW-BDB-POL-006"
section = "§6.7"
summary = "Persistent data set retained across power cycles"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::persist"
tests = ["end_device_and_coordinator_survive_reboots"]

[[requirement]]
id = "PW-BDB-POL-007"
section = "§6.10"
summary = "APS acknowledgement and APS security usage rules for ZCL and ZDO traffic"
level = "mandatory"
status = "implemented"
module = "panweave-aps::layer"
tests = ["trust_center_join_and_link_key_update", "bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Acknowledged and APS-secured requests are answered with matching ack request and security (ADR-0005); ZCL responses inherit the acknowledgement request of the command."
[[requirement]]
id = "PW-BDB-POL-008"
section = "§6.11"
summary = "Install codes: 18-octet code with CRC-16 check, hashed with AES-MMO to derive TCLK; formats of 8/10/14/18 octets"
level = "mandatory"
status = "implemented"
module = "panweave-types::key::InstallCode, panweave-security::key_hierarchy"
tests = ["install_code_crc_known_answer", "install_code_known_answer_from_bdb"]

[[requirement]]
id = "PW-BDB-POL-009"
section = "§6.12"
summary = "Short device setup codes"
level = "optional"
status = "not-implemented"
module = "panweave-security::setup_code"
tests = []

[[requirement]]
id = "PW-BDB-INIT-001"
section = "§7.1"
summary = "Initialization procedure: restore persistent data, if on a network attempt rejoin per §10.1 (routers resume, end devices rejoin), otherwise wait for commissioning"
level = "mandatory"
status = "partially-implemented"
module = "panweave-runtime::persist"
tests = ["end_device_and_coordinator_survive_reboots", "factory_reset_erases_network_state"]
notes = "Stack::restore + Stack::resume: routers and the coordinator resume on their network and re-announce, end devices perform a secured rejoin (falling back to a Trust Center rejoin is left to the application via JoinMode::TrustCenterRejoin); the BDB commissioning-mode dispatch that follows initialization is part of the pending panweave-bdb crate."
[[requirement]]
id = "PW-BDB-INIT-002"
section = "§7.2"
summary = "On-network TCLK update procedure: after joining a centralized network request a unique TCLK (Request Key or DLK), verify it with Verify Key / Confirm Key, retry up to bdbTCLinkKeyExchangeAttemptsMax, leave on failure if required"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::pump"
tests = ["coordinator_and_end_device_full_stack"]
notes = "After a join with a global key on a centralized network the joiner requests a unique TCLK (Request Key), verifies it (Verify Key) and receives Confirm Key; bdbTCLinkKeyExchangeAttemptsMax retries and the DLK variant are not implemented."
[[requirement]]
id = "PW-BDB-INIT-003"
section = "§7.3"
summary = "Ensuring TC connectivity via keep-alive cluster, poll control, or node descriptor polling"
level = "conditional"
status = "partially-implemented"
module = "panweave-runtime::keep_alive"
tests = ["router_keep_alive_detects_a_vanished_trust_center", "poll_control_check_in_puts_the_sleepy_device_into_fast_poll_mode"]
notes = "The Keep-Alive client (Match_Desc discovery of the Trust Center's cluster 0x0025, APS-secured attribute reads at the advertised base/jitter pacing, TrustCenterLost after three failures) and the Poll Control server / client are implemented in panweave-runtime; the Node Descriptor polling fallback of §7.3 for Trust Centers without either cluster is not (TODO(PW-BDB-TC-CONNECTIVITY))."
[[requirement]]
id = "PW-BDB-INIT-004"
section = "§7.4"
summary = "Application link keys with non-TC devices via Request Key"
level = "optional"
status = "not-implemented"
module = "panweave-bdb::app_keys"
tests = []

[[requirement]]
id = "PW-BDB-FORM-001"
section = "§8.1"
summary = "Network formation: coordinator forms centralized network on primary then secondary channels; router forms distributed network with random extended PAN ID and network key; set permit join off; update commissioning status"
level = "mandatory"
status = "implemented"
module = "panweave-bdb"
tests = ["formation_falls_back_to_secondary_list", "bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Centralized formation on the configured mask with a supplied or CryptoRng-generated network key; secondary mask fallback and distributed formation by routers are not wired."
[[requirement]]
id = "PW-BDB-STEER-001"
section = "§9.1"
summary = "Network discovery procedure across primary then secondary channel masks with bdbScanDuration"
level = "mandatory"
status = "implemented"
module = "panweave-bdb"
tests = ["steering_retries_then_secondary_then_opens_network", "bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Discovery only considers networks permitting joins with end-device (or router) capacity; suitability beyond the NWK ranking is left to the application."
[[requirement]]
id = "PW-BDB-STEER-002"
section = "§9.2, §9.3"
summary = "Join using symmetric key exchange: select network with permit join, MAC associate, receive network key with preconfigured link key (global or install code), then TCLK update"
level = "mandatory"
status = "partially-implemented"
module = "panweave-bdb"
tests = ["steering_leaves_after_failed_key_exchange", "bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Join, network key delivery, Device_annce, Request Key / Verify Key TCLK exchange with bdbcfSecurityTimeoutPeriod and leave on failure are implemented. The Node_Desc_req to detect an r20 Trust Center (steps 5–7) and the CBKE branch are not."
[[requirement]]
id = "PW-BDB-STEER-003"
section = "§9.4, §9.5"
summary = "Join using key negotiation (DLK) with Network Commissioning Request and Security_Start_Key_Negotiation"
level = "mandatory"
status = "implemented"
module = "panweave-runtime::dlk"
tests = ["anonymous_key_negotiation_join_through_router", "install_code_authenticated_negotiation", "wrong_passphrase_fails_and_restores_the_entry"]
notes = "Joining with a Network Commissioning Request and the Security_Start_Key_Negotiation / Security_Key_Negotiation exchanges, anonymous (well-known passphrase) or install-code authenticated, through a router parent; failures restore the previous key-pair entry."
[[requirement]]
id = "PW-BDB-STEER-004"
section = "§9.6"
summary = "Certificate-based TCLK exchange (CBKE) when supported"
level = "optional"
status = "partially-implemented"
module = "panweave-smart-energy::key_establishment"
tests = ["cbke_over_the_key_establishment_cluster_installs_a_working_link_key"]
notes = "The Key Establishment cluster and CBKE machines are in panweave-smart-energy and the simulator test installs the derived Trust Center link key on both sides; the curve arithmetic is host-supplied (ADR-0012) and the runtime does not start the exchange by itself after joining."
[[requirement]]
id = "PW-BDB-STEER-005"
section = "§9.7"
summary = "On-network steering: broadcast Mgmt_Permit_Joining_req with bdbcMinCommissioningTime, local permit join; local disabling"
level = "mandatory"
status = "implemented"
module = "panweave-bdb"
tests = ["bdb_formation_steering_finding_binding_and_rejoin"]

[[requirement]]
id = "PW-BDB-STEER-006"
section = "§9.8"
summary = "Off-network steering: discovery, join attempt per network, on success TCLK update, broadcast permit joining, device announce"
level = "mandatory"
status = "implemented"
module = "panweave-bdb"
tests = ["steering_retries_then_secondary_then_opens_network", "bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Same-network retries (bdbcRecSameNetworkRetryAttempts, capped at bdbcMaxSameNetworkRetryAttempts), primary then secondary lists, commissioning window broadcast + local permit join and bdbcMinFastPollDurationAfterJoin fast polling. The optional 0–5 s random start delay is left to the application."
[[requirement]]
id = "PW-BDB-STEER-007"
section = "§9.9"
summary = "Device interview procedure (R23): TC retrieves descriptors/configuration before authorising; joiner responds; timeouts"
level = "mandatory"
status = "partially-implemented"
module = "panweave-runtime::dlk"
tests = ["anonymous_key_negotiation_join_through_router"]
notes = "Authorization is withheld until the negotiated key is verified (R23.2 §4.7.3.3); the Trust Center's optional descriptor / configuration retrieval between verification and the network key is not exposed as a hook (see PW-R23-SEC-031, TODO(PW-INTERVIEW))."
[[requirement]]
id = "PW-BDB-REJOIN-001"
section = "§10.1"
summary = "Rejoin procedure: secured rejoin on current channel, then all channels, then unsecured TC rejoin if allowed, with back-off and attempt limits; end devices choose parent by link quality"
level = "mandatory"
status = "implemented"
module = "panweave-bdb"
tests = ["rejoin_walks_the_channel_lists", "bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Secured rejoin on the current channel, TC rejoin on the current channel (centralized, verified key), then secured rejoins over the primary and secondary lists; the lost-TC entry point skips step 1."
[[requirement]]
id = "PW-BDB-FB-001"
section = "§11"
summary = "Finding & binding: target identifies for bdbcMinCommissioningTime; initiator sends Identify Query broadcast, discovers simple descriptors of responders, creates bindings for matching clusters, optionally groups"
level = "mandatory"
status = "implemented"
module = "panweave-bdb"
tests = ["finding_and_binding_initiator_binds_matching_clusters", "finding_and_binding_group_and_failures", "bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Utility clusters (ZCL8 chapter 3 classification) are never bound; unicast bindings resolve the IEEE address with IEEE_addr_req when unknown; group bindings send Add Group to the respondent."
[[requirement]]
id = "PW-BDB-TL-001"
section = "§12"
summary = "Touchlink initiator and target procedures (inter-PAN scan, identify, network start/join, key transport with touchlink key)"
level = "optional"
status = "implemented"
module = "panweave-bdb::touchlink"
tests = ["ranges_assign_and_split", "factory_new_end_device_starts_a_network_with_a_router_target", "initiator_on_a_network_joins_a_router_and_respects_stealing_policy", "same_network_reconciles_update_id_and_reset_sends_the_request", "target_ignores_weak_scans_wrong_transactions_and_expires", "factory_new_remote_starts_a_network_through_a_lamp_and_adds_another"]
notes = "Initiator (§12.1): random non-zero transaction identifier, five scan requests on the first primary channel then one per remaining channel, the optional secondary set, candidate collection with RSSI correction, device information and identify requests, the same-network nwkUpdateId reconciliation (§13.3.4.9/10 wrap rule) with Network Update Request, the centralized-network and address-assignment checks, Network Start Request from a factory new end device to a router target (network address 0x0001 for itself, 0x0002 onwards for targets, group and free-range splitting per §13.3.4.8) followed by adoption of the responded parameters and a secured rejoin after aplcMinStartupDelayTime, Network Join Router / End Device Requests from an initiator on a network, aplcRxWindowDuration timeouts, the touchlink reset request. Target (§12.2): RSSI threshold and link-initiator checks, the transaction lifetime, a stable response identifier per transaction, scan responses with the device information table, network start (parameters chosen when the initiator leaves them open) and join under the stealing policy (refused with status 1 on centralized networks unless allowed), network update, reset to factory new. Runtime: inter-PAN frames through the MAC, distributed network formation / adoption with the assigned address, end-device rejoin. Not done: a factory new router initiator (it forms through the BDB formation procedure, step 19), NLME-ADD-NEIGHBOR of the initiator (the rejoin adds it as a child), binding links of step 25, and the master key (index 4) is only used when the application supplies it."
[[requirement]]
id = "PW-BDB-RESET-001"
section = "§13.1–§13.3"
summary = "Reset to factory new via Basic cluster Reset to Factory Defaults, touchlink reset, or local action: leave network, clear persistent data"
level = "mandatory"
status = "partially-implemented"
module = "panweave-runtime::persist"
tests = ["factory_reset_erases_network_state"]
notes = "Stack::erase_persisted clears all network state records; the Basic cluster Reset to Factory Defaults command and touchlink reset are not wired."
[[requirement]]
id = "PW-BDB-RESET-002"
section = "§13.4, §13.5"
summary = "Removing a node: TC uses Mgmt_Leave / Remove Device on centralized networks; any router on distributed"
level = "mandatory"
status = "partially-implemented"
module = "panweave-runtime::stack"
tests = ["trust_center_removes_a_device_through_its_parent"]
notes = "Stack::remove_device (Trust Center only) sends a NWK Leave to a child or an APS Remove Device to the device's parent (R23.2 §4.6.3.6.1); a Mgmt_Leave_req codec exists in panweave-zdo but no convenience for removing a node with it, and the distributed-network case (any router issuing the leave) is not wrapped (TODO(PW-BDB-REMOVE-NODE))."
