# Panweave conformance inventory: Zigbee Direct 1.1 (20-27688-041).

document = "ZD1.1"
title = "Zigbee Direct Specification, Revision 1.1"

[[requirement]]
id = "PW-ZD-SEC-001"
section = "§6.2, §6.3"
summary = "ZDD security states (unprovisioned/provisioned), session types (provisioning, authorization, BLE secure), state transitions"
level = "mandatory"
status = "partially-implemented"
module = "panweave-direct::auth"
tests = ["annex_b3_authorization_keys"]
notes = "Session types follow from the pre-shared secret (Psk::is_provisioning), authorization levels are modelled (auth::Level) and the Basic / Admin keys are derived per Table 2 (Annex B.3 vectors); the Responder refuses secrets the application does not offer (e.g. anonymous sessions while the Anonymous Join Countdown Timer is 0). The provisioned / unprovisioned ZDD state machine and the one-authorization-session rule are left to the ZDD integration."
[[requirement]]
id = "PW-ZD-SEC-002"
section = "§6.5.1.2"
summary = "Session establishment ECDHE-PSK/P-256/SHA-256/HMAC-SHA-256-128: four messages carrying method and public point TLVs, key derivation and MAC tag confirmation"
level = "mandatory"
status = "implemented"
module = "panweave-direct::session"
tests = ["annex_b1_ecdhe_p256_vectors", "responder_refuses_wrong_method_and_psk"]
notes = "Initiator (ZVD) and Responder (ZDD) machines for the four Session Establishment messages; P-256 ECDH with SHA-256 shared-secret hashing over the ordered session identifier, HMAC-SHA-256-128 session key and 32-octet MacTags (KC_2_U / KC_2_V); every Annex B.1 vector reproduced. Feature p256."
[[requirement]]
id = "PW-ZD-SEC-003"
section = "§6.5.1.3"
summary = "Session establishment SPEKE/Curve25519/AES-MMO-128/HMAC-AES-MMO-128"
level = "mandatory"
status = "implemented"
module = "panweave-direct::session"
tests = ["annex_b2_speke_curve25519_vectors"]
notes = "SPEKE with the PSK-derived generator, AES-MMO-128 hashing and HMAC-AES-MMO-128 (shared with the R23 DLK primitives of panweave-security), 16-octet MacTags; Annex B.2 vectors reproduced. Feature curve25519. SPEKE/Curve25519/SHA-256 stays reserved (Method 2 is decoded but refused)."
[[requirement]]
id = "PW-ZD-SEC-004"
section = "§6.4"
summary = "Secured characteristic payloads with CCM, nonce from unique address and counters, counter monotonicity, exception handling"
level = "mandatory"
status = "implemented"
module = "panweave-direct::secure"
tests = ["annex_b4_join_network_write"]
notes = "SecureChannel keeps the session key and the incoming / outgoing counters: AES-CCM-128 with the 34-octet unique address of the characteristic as associated data, the nonce of §6.4.3, counter || ciphertext || MIC framing, freshness (strictly increasing counter) and authenticity checks that leave the incoming counter untouched on failure, and CounterExhausted at 0xffffffff; Annex B.4 reproduced. The ATT error responses themselves belong to the BLE host integration."
[[requirement]]
id = "PW-ZD-SEC-005"
section = "§6.5.2"
summary = "Security service local TLVs (method, P-256 point, Curve25519 point, network key sequence number, MacTag)"
level = "mandatory"
status = "implemented"
module = "panweave-direct::tlv"
tests = ["annex_b1_ecdhe_p256_vectors", "annex_b2_speke_curve25519_vectors"]
notes = "Key Negotiation Method (method + PSK enumerations), P-256 and Curve25519 Public Point (EUI-64 + point), Network Key Sequence Number and MacTag TLVs in the Annex I TLV format."
[[requirement]]
id = "PW-ZD-ZDD-001"
section = "§7.6"
summary = "ZDD BLE advertisement extension (service UUID, network status, PAN identifier data)"
level = "mandatory"
status = "implemented"
module = "panweave-direct::advertisement"
tests = ["round_trip_and_not_joined_defaults"]
notes = "Service Data AD structure with the Commissioning Service UUID, version 1, ZDTS / PermitJoin flags, PAN ID and NWK address (0xffff when not joined); encode and find-in-advertisement."
[[requirement]]
id = "PW-ZD-ZDD-002"
section = "§7.7.2"
summary = "Commissioning service characteristics: form network, permit joining, join network (MAC association / rejoin / out-of-band), leave, commissioning status, manage joiners, identify, finding and binding; TLV items"
level = "mandatory"
status = "partially-implemented"
module = "panweave-direct::commissioning,panweave::direct"
tests = ["join_network_tlv_usage_rules", "status_round_trip", "zdd_side_authorization_and_flow", "zdd_form_open_join_adopt_and_leave"]
notes = "Table 27 / Table 44 TLV codecs, the Form/Join/Permit/Leave/Commissioning Status/Manage Joiners/Identify/Finding & Binding payloads with the joining-method TLV usage rules of Tables 39-41, the authorization matrix of Table 26 and Status Code notifications are in panweave-direct::commissioning behind the Zdd trait; the facade Node implements Zdd (panweave::direct, feature direct): formation with the ZVD's parameters, joining by association / rejoin / out-of-band adoption, permit joining, leave, Manage Joiners provisional link keys, Identify and Finding & Binding, with completion reported through Event::Direct. Not yet: the TCLK update after an out-of-band join with a provisional key (§7.7.2.7.4), the Admin key derivation hand-off to the session layer, and forming a distributed network from a node configured for centralized security (the security model follows the node's role) (TODO(PW-ZD-RUNTIME))."
[[requirement]]
id = "PW-ZD-ZDD-003"
section = "§7.7.3, §7.7.4"
summary = "Tunnel service NPDU characteristic, NPDU message TLV, trusted-link pre/post processing in the NWK layer, joining centralized/distributed networks on behalf of the ZVD, ZVD as trust center, ZVD rejoin/forming"
level = "mandatory"
status = "partially-implemented"
module = "panweave-direct::tunnel,panweave-nwk::layer,panweave::direct"
tests = ["npdu_message_round_trip_and_session_rule", "a_virtual_device_joins_and_exchanges_data_over_a_trusted_link", "zvd_joins_and_talks_through_the_tunnel"]
notes = "NPDU Message TLV codec and the trusted-link pre-/post-processing of §7.7.4.1-7.7.4.2 including the ZVD-provisioning-session drop rule of §7.7.3.6.2; the NWK-layer Trusted Link interface (R23.2 NLME-TRUSTEDLINK-PREPROCESSING / POSTPROCESSING, ADR-0017): an NPDU received over the link is processed as from that neighbour without an auxiliary header, treated as NWK-secured when SecurityEnable is set, a joiner heard over the link is kept as a neighbour behind it, and unicasts to it and copies of broadcasts leave as plaintext NPDUs with the SecurityEnable flag telling the peer whether NWK security would have applied. Joining a centralized network on behalf of the ZVD (§7.7.4.3) works end to end in the facade: the Network Commissioning Request (with the Device Capability Extension ZVD flag; dropped without it per §7.7.4.8) over the provisioning session, the response and the Trust Center's Basic authorization key (StandardKeyType 0xB2 under the key-load key, never the network key) back over the tunnel, then frames on the authorized session (a ZDP request answered through the link); a network key update sends a fresh Basic key and the network-key broadcast is declined for the tunnel (§9). The 0xB2 key descriptor layout is an interpretation (ADR-0017 decision 2, requires-clarification). Not done: the ZVD acting as Trust Center (§7.7.4.4), joining a distributed network with the ZDD deriving the key (§7.7.4.5), ZVD rejoin and forming through the ZDD (§7.7.4.6-7.7.4.7) (TODO(PW-ZD-TRUSTEDLINK))."
[[requirement]]
id = "PW-ZD-ZVD-001"
section = "§8"
summary = "ZVD behaviour: discovery of ZDDs, security, reconnection, commissioning and tunnel clients, EUI-64 allocation"
level = "mandatory"
status = "partially-implemented"
module = "panweave-direct::commissioning"
tests = []
notes = "ZVD-side encoders for the commissioning writes and the Commissioning Status decoder exist (commissioning::{FormNetwork,JoinNetwork,ManageJoiners,LeaveNetwork,FindingBinding}::encode, decode_status), the advertisement parser and the session initiator; ZDD discovery, reconnection and the EUI-64 allocation rules of §8 are not implemented."
[[requirement]]
id = "PW-ZD-KEY-001"
section = "§9"
summary = "Network key rotation with limited authorization sessions"
level = "mandatory"
status = "partially-implemented"
module = "panweave-direct::rotation"
tests = ["past_keys_are_kept_and_derive_basic_keys", "sessions_are_classified", "transport_key_messages_are_not_tunnelled", "zdd_keeps_past_network_keys_for_limited_authorization", "zvd_joins_and_talks_through_the_tunnel", "annex_b3_vectors"]
notes = "The past-network-key store (PastNetworkKeys, at least one key, persisted by the facade under Kind::DirectPastKeys and recorded on every StackEvent::NetworkKeySwitched), the Basic authorization key derived from a past key (panweave_security::authorization, Annex B.3 vector), the network key sequence number of Session Establishment Message 1 handed to the secret resolver and reported in Established::peer_key_sequence, the Limited Authorization classification (SessionClass: tunnel rules of a provisioning session, no commissioning, no Basic key translation outside it) and the APSME forwarding decision for Transport Key messages conveying a network key are implemented; the ZDD facade applies the decision to every NPDU the NWK layer routes to the ZVD over the Trusted Link, reporting Event::DirectTunnelDeclined for the host to close the connection instead of tunnelling the frame (§9), and the Trust Center delivers a Basic key derived from the prospective network key to every virtual device on a key update (R23.2 §4.6.3.2.2.4, ADR-0017). The section 10 translation to a basic-key Transport Key on legacy networks belongs to PW-ZD-LEGACY-001."
[[requirement]]
id = "PW-ZD-LEGACY-001"
section = "§10"
summary = "Legacy network support: ephemeral authorization, routing on behalf of ZVD, joining flows per network class"
level = "conditional"
status = "not-implemented"
module = "panweave-direct::legacy"
tests = []
