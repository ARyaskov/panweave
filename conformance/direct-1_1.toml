# Panweave conformance inventory: Zigbee Direct 1.1 (20-27688-041).

document = "ZD1.1"
title = "Zigbee Direct Specification, Revision 1.1"

[[requirement]]
id = "PW-ZD-SEC-001"
section = "§6.2, §6.3"
summary = "ZDD security states (unprovisioned/provisioned), session types (provisioning, authorization, BLE secure), state transitions"
level = "mandatory"
status = "implemented"
module = "panweave-direct::state,panweave-direct::auth,panweave::direct"
tests = ["annex_b3_authorization_keys", "an_unprovisioned_zdd_times_out_unless_provisioning_starts", "a_provisioned_zdd_admits_by_the_network_state_and_the_cluster", "the_zdd_security_state_follows_the_network_and_the_sessions", "the_trust_center_configures_the_zdd_interface"]
notes = "Session types follow from the pre-shared secret (Psk::is_provisioning), authorization levels are modelled (auth::Level) and the Basic / Admin keys are derived per Table 2 (Annex B.3 vectors); the Responder refuses secrets the application does not offer. The §6.2 state machine is panweave_direct::state::SecurityState, bound by the facade: Open to be provisioned for NEW_ZDD_PROVISIONING_TIMEOUT (180 s, never below the 60 s floor) after power-up or a user action (Node::direct_power_up), held open by a provisioning session, BLE interface Off afterwards, Open to connect once on a network, back to Open to be provisioned on leaving, and Off / On as the Configuration cluster says; Event::DirectAdvertising tells the host when the Zigbee Direct advertisement starts and stops. Session admission (Node::direct_admit, for the host's secret resolver): authorization keys only on a provisioned ZDD, provisioning sessions on a provisioned ZDD only while the network permits joining (§6.6), the anonymous secret only while the Anonymous Join Countdown Timer runs (Node::anonymous_join_allowed, restarted on power-up and reconfiguration, §11.3.5.4.4) and never for a ZVD that holds an authorization session (§6.3.1); sessions are tracked through Node::direct_session_opened / direct_session_closed. The Zigbee Direct aware check of §6.2.3 is Node::check_direct_aware (DirectState::trust_center_aware; PW-ZD-ZCL-001). The BLE advertisement itself and the manufacturer extensions of the Off state are the host's."
[[requirement]]
id = "PW-ZD-SEC-002"
section = "§6.5.1.2"
summary = "Session establishment ECDHE-PSK/P-256/SHA-256/HMAC-SHA-256-128: four messages carrying method and public point TLVs, key derivation and MAC tag confirmation"
level = "mandatory"
status = "implemented"
module = "panweave-direct::session"
tests = ["annex_b1_ecdhe_p256_vectors", "responder_refuses_wrong_method_and_psk"]
notes = "Initiator (ZVD) and Responder (ZDD) machines for the four Session Establishment messages; P-256 ECDH with SHA-256 shared-secret hashing over the ordered session identifier, HMAC-SHA-256-128 session key and 32-octet MacTags (KC_2_U / KC_2_V); every Annex B.1 vector reproduced. Feature p256."
[[requirement]]
id = "PW-ZD-SEC-003"
section = "§6.5.1.3"
summary = "Session establishment SPEKE/Curve25519/AES-MMO-128/HMAC-AES-MMO-128"
level = "mandatory"
status = "implemented"
module = "panweave-direct::session"
tests = ["annex_b2_speke_curve25519_vectors"]
notes = "SPEKE with the PSK-derived generator, AES-MMO-128 hashing and HMAC-AES-MMO-128 (shared with the R23 DLK primitives of panweave-security), 16-octet MacTags; Annex B.2 vectors reproduced. Feature curve25519. SPEKE/Curve25519/SHA-256 stays reserved (Method 2 is decoded but refused)."
[[requirement]]
id = "PW-ZD-SEC-004"
section = "§6.4"
summary = "Secured characteristic payloads with CCM, nonce from unique address and counters, counter monotonicity, exception handling"
level = "mandatory"
status = "implemented"
module = "panweave-direct::secure"
tests = ["annex_b4_join_network_write"]
notes = "SecureChannel keeps the session key and the incoming / outgoing counters: AES-CCM-128 with the 34-octet unique address of the characteristic as associated data, the nonce of §6.4.3, counter || ciphertext || MIC framing, freshness (strictly increasing counter) and authenticity checks that leave the incoming counter untouched on failure, and CounterExhausted at 0xffffffff; Annex B.4 reproduced. The ATT error responses themselves belong to the BLE host integration."
[[requirement]]
id = "PW-ZD-SEC-005"
section = "§6.5.2"
summary = "Security service local TLVs (method, P-256 point, Curve25519 point, network key sequence number, MacTag)"
level = "mandatory"
status = "implemented"
module = "panweave-direct::tlv"
tests = ["annex_b1_ecdhe_p256_vectors", "annex_b2_speke_curve25519_vectors"]
notes = "Key Negotiation Method (method + PSK enumerations), P-256 and Curve25519 Public Point (EUI-64 + point), Network Key Sequence Number and MacTag TLVs in the Annex I TLV format."
[[requirement]]
id = "PW-ZD-ZDD-001"
section = "§7.6"
summary = "ZDD BLE advertisement extension (service UUID, network status, PAN identifier data)"
level = "mandatory"
status = "implemented"
module = "panweave-direct::advertisement"
tests = ["round_trip_and_not_joined_defaults"]
notes = "Service Data AD structure with the Commissioning Service UUID, version 1, ZDTS / PermitJoin flags, PAN ID and NWK address (0xffff when not joined); encode and find-in-advertisement."
[[requirement]]
id = "PW-ZD-ZDD-002"
section = "§7.7.2"
summary = "Commissioning service characteristics: form network, permit joining, join network (MAC association / rejoin / out-of-band), leave, commissioning status, manage joiners, identify, finding and binding; TLV items"
level = "mandatory"
status = "implemented"
module = "panweave-direct::commissioning,panweave::direct"
tests = ["join_network_tlv_usage_rules", "status_round_trip", "zdd_side_authorization_and_flow", "zdd_form_open_join_adopt_and_leave", "an_out_of_band_join_updates_a_provisional_link_key_when_the_trust_center_answers", "the_zvd_chooses_the_security_model_of_a_formed_network"]
notes = "Table 27 / Table 44 TLV codecs, the Form/Join/Permit/Leave/Commissioning Status/Manage Joiners/Identify/Finding & Binding payloads with the joining-method TLV usage rules of Tables 39-41, the authorization matrix of Table 26 and Status Code notifications are in panweave-direct::commissioning behind the Zdd trait; the facade Node implements Zdd (panweave::direct, feature direct): formation with the ZVD's parameters and the security model the Trust Center Address TLV selects (Stack::set_security_model: a coordinator-capable ZDD forms either kind, a router only distributed; §7.7.2.5), joining by association / rejoin / out-of-band adoption, permit joining, leave, Manage Joiners provisional link keys, Identify and Finding & Binding, with completion reported through Event::Direct. After an out-of-band join with a provisional Trust Center link key the ZDD runs the On-Network TCLK Update procedure (Stack::update_trust_center_link_key), stays on the network when it fails and retries every TCLK_UPDATE_RETRY (60 s, an implementation choice) until the key is verified (§7.7.2.7.4). The Admin key of §6.3.2.1 / §7.7.2.7.1: Node::admin_key_for(zvd) is the key a Form / Join Network write provisioned (persisted under Kind::DirectAdminKey until a factory reset) or, on a centralized network, the key derived from the active TCLK; none on a distributed network without a provisioned key. The BLE transport (characteristic reads / writes / notifications) is the host's."
[[requirement]]
id = "PW-ZD-ZDD-003"
section = "§7.7.3, §7.7.4"
summary = "Tunnel service NPDU characteristic, NPDU message TLV, trusted-link pre/post processing in the NWK layer, joining centralized/distributed networks on behalf of the ZVD, ZVD as trust center, ZVD rejoin/forming"
level = "mandatory"
status = "implemented"
module = "panweave-direct::tunnel,panweave-nwk::layer,panweave::direct"
tests = ["npdu_message_round_trip_and_session_rule", "a_virtual_device_joins_and_exchanges_data_over_a_trusted_link", "zvd_joins_and_talks_through_the_tunnel", "zvd_joins_a_distributed_network_through_the_tunnel", "a_zvd_acting_as_trust_center_attaches_behind_the_trusted_link", "a_zvd_rejoins_through_the_tunnel"]
notes = "NPDU Message TLV codec and the trusted-link pre-/post-processing of §7.7.4.1-7.7.4.2 including the ZVD-provisioning-session drop rule of §7.7.3.6.2; the NWK-layer Trusted Link interface (R23.2 NLME-TRUSTEDLINK-PREPROCESSING / POSTPROCESSING, ADR-0017): an NPDU received over the link is processed as from that neighbour without an auxiliary header, treated as NWK-secured when SecurityEnable is set, a joiner heard over the link is kept as a neighbour behind it, and unicasts to it and copies of broadcasts leave as plaintext NPDUs with the SecurityEnable flag telling the peer whether NWK security would have applied. Joining a centralized network on behalf of the ZVD (§7.7.4.3) works end to end in the facade: the Network Commissioning Request (with the Device Capability Extension ZVD flag; dropped without it per §7.7.4.8) over the provisioning session, the response and the Trust Center's Basic authorization key (StandardKeyType 0xB2 under the key-load key, never the network key) back over the tunnel, then frames on the authorized session (a ZDP request answered through the link); a network key update sends a fresh Basic key and the network-key broadcast is declined for the tunnel (§9). The 0xB2 key descriptor layout is an interpretation (ADR-0017 decision 2, requires-clarification). On a distributed network the ZDD router itself derives and transports the Basic key under the distributed global link key (§7.7.4.5). A ZVD operating as Trust Center (§7.7.4.4) attaches behind the link with the Establish Trusted Link commissioning type: accepted NWK-secured from the configured Trust Center for address 0x0000 only, it becomes a router neighbour behind the link exempt from Link Status aging, reported as StackEvent::TrustCenterLinked, and unicasts to 0x0000 leave over the link. ZVD rejoins (§7.7.4.6): a secure rejoin over the authorized session is admitted without a key transport, a Trust Center rejoin over a (limited) provisioning session gets a Basic key derived from the current network key (the policy's verified-unique-key rule is not applied to virtual devices: ADR-0017 decision 6, requires-clarification). A ZVD forming a network (§7.7.4.7) is the out-of-band join of PW-ZD-ZDD-002 on the ZDD side."
[[requirement]]
id = "PW-ZD-ZVD-001"
section = "§8"
summary = "ZVD behaviour: discovery of ZDDs, security, reconnection, commissioning and tunnel clients, EUI-64 allocation"
level = "mandatory"
status = "partially-implemented"
module = "panweave-direct::zvd,panweave-direct::commissioning,panweave-direct::session,panweave-direct::advertisement"
tests = ["allocated_identifiers_follow_the_rules", "the_client_joins_reconnects_and_rejoins", "discovery_is_retried_at_least_once_then_given_up"]
notes = "ZVD-side pieces: the advertisement parser (Advertisement::find, §7.6.3), the session Initiator of §6.5 (Curve25519 / P-256, Annex B vectors), the Commissioning Service encoders and the Commissioning Status decoder (commissioning::{FormNetwork, JoinNetwork, ManageJoiners, LeaveNetwork, FindingBinding}::encode, decode_status; §8.4.2), and zvd::TunnelClient, the connection / re-establishment machine of §8.3.3 and the tunnel-client steps of §8.4.3.3 (discovery filtered by the Tunnel Service flag and the ZVD's PAN ID, reconnection to previously known ZDDs by BLE address, at least one discovery retry, an alternative ZDD after a failed session, the Network Commissioning Request kind chosen from the provisioning state and the ZDD's announced key sequence number, address-conflict handling), with zvd::random_eui64 (§8.5, U/L bit set) and zvd::random_short_address (§3.6.1.8). The host supplies the BLE primitives (§8.2 ATT_MTU negotiation is the platform's). Not provided: a ZVD-TS Zigbee stack running over the tunnel (APS / NWK / ZDO / BDB / ZCL on the ZVD, §8.4.3.3); the panweave stack is the ZDD side, and a host may run its own stack on the tunnel client with the codecs of this crate."
[[requirement]]
id = "PW-ZD-KEY-001"
section = "§9"
summary = "Network key rotation with limited authorization sessions"
level = "mandatory"
status = "implemented"
module = "panweave-direct::rotation"
tests = ["past_keys_are_kept_and_derive_basic_keys", "sessions_are_classified", "transport_key_messages_are_not_tunnelled", "zdd_keeps_past_network_keys_for_limited_authorization", "zvd_joins_and_talks_through_the_tunnel", "annex_b3_vectors", "a_zdd_on_a_legacy_network_authorizes_the_zvd_itself"]
notes = "The past-network-key store (PastNetworkKeys, at least one key, persisted by the facade under Kind::DirectPastKeys and recorded on every StackEvent::NetworkKeySwitched), the Basic authorization key derived from a past key (panweave_security::authorization, Annex B.3 vector), the network key sequence number of Session Establishment Message 1 handed to the secret resolver and reported in Established::peer_key_sequence, the Limited Authorization classification (SessionClass: tunnel rules of a provisioning session, no commissioning, no Basic key translation outside it) and the APSME forwarding decision for Transport Key messages conveying a network key are implemented; the ZDD facade applies the decision to every NPDU the NWK layer routes to the ZVD over the Trusted Link, reporting Event::DirectTunnelDeclined for the host to close the connection instead of tunnelling the frame (§9), and the Trust Center delivers a Basic key derived from the prospective network key to every virtual device on a key update (R23.2 §4.6.3.2.2.4, ADR-0017). On a legacy network the Trust Center rejoin of the Limited Authorization session is answered by the ZDD with a Basic key derived from the active network key (§10 item 3, PW-ZD-LEGACY-001)."
[[requirement]]
id = "PW-ZD-LEGACY-001"
section = "§10"
summary = "Legacy network support: ephemeral authorization, routing on behalf of ZVD, joining flows per network class"
level = "conditional"
status = "implemented"
module = "panweave-direct::legacy,panweave::direct"
tests = ["aps_frames_are_classified", "the_well_known_key_probe_recognizes_its_own_frames", "the_ephemeral_session_filters_and_graduates", "a_zdd_on_a_legacy_network_authorizes_the_zvd_itself"]
notes = "A ZDD whose §6.2.3 check found a Trust Center that is not Zigbee Direct aware (DirectState::trust_center_aware == Some(false)) applies §10: the network key the Trust Center tunnels never crosses the link; after an initial join the ZVD gets an ephemeral authorization key (global when the tunnelled Transport Key decrypts under ZigBeeAlliance09, unique otherwise: class II / class III), which opens an ephemeral authorization session (§10.1: only APS-secured traffic between the ZVD and 0x0000, unsecured traffic once the Trust Center's key-load secured message was seen, and Relay Message commands pass; NWK commands never), the ZVD is treated as an end-device child for routing on its behalf (§10.1.1) and its unauthenticated-child entry kept alive, and once the Trust Center's data-key secured message follows the ZDD sends the Basic key derived from the active network key on the Trust Center's behalf and makes the ZVD a child; no proof within apsSecurityTimeOutPeriod forgets the ZVD (Event::DirectAuthorizationTimeout). A Trust Center rejoin over a Limited Authorization session is answered with a Basic key derived from the active network key (§10 item 3). Class I (distributed) is §7.7.4.5 (PW-ZD-ZDD-003). The facade test drives class II end to end with a test-side ZVD APS layer against a Trust Center configured with zigbee_direct_aware = false; the unique-ephemeral-key branch (class III) is exercised only by the probe's unit test. Securing the rejoin's Basic key under the well-known key is an interpretation (ADR-0017 decision 8, requires-clarification)."
[[requirement]]
id = "PW-ZD-ZCL-001"
section = "§11.3, §6.2.3"
summary = "Zigbee Direct Configuration cluster (0x003D): InterfaceState, AnonymousJoinTimeout, Configure Zigbee Direct Interface / Anonymous Join Timeout, Trust Center authorization, persistence, the Zigbee Direct aware check"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::direct_configuration,panweave::direct"
tests = ["interface_and_timeout_are_configured_by_an_authorized_source", "the_trust_center_configures_the_zdd_interface"]
notes = "Server and client with the two attributes and commands (§11.3.5); on a centralized network only APS-secured unicasts from the Trust Center are accepted, on a distributed one any APS-secured unicast, others get Default Response NOT_AUTHORIZED (§11.3.5.1); the facade persists both settings under Kind::DirectConfig, restores them on initialize(), exposes direct_interface_enabled() / anonymous_join_allowed() and restarts the Anonymous Join Countdown Timer on power-up and reconfiguration (§11.3.5.4.4); check_direct_aware() sends the Match_Desc_req of §6.2.3 for the client cluster on the Trust Center. Stopping the BLE advertisements when the interface is disabled is the host's, as is the local stimulus that restarts the countdown."
