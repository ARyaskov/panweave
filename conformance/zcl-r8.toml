# Panweave conformance inventory: Zigbee Cluster Library Revision 8 (07-5123-08).

document = "ZCL8"
title = "Zigbee Cluster Library Specification, Revision 8"

[[requirement]]
id = "PW-ZCL-FND-001"
section = "§2.4.1"
summary = "ZCL frame header: frame control (frame type, manufacturer specific, direction, disable default response), optional manufacturer code, transaction sequence number, command identifier"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::frame"
tests = ["header_round_trip"]

[[requirement]]
id = "PW-ZCL-FND-002"
section = "§2.6.2"
summary = "Data types: null, general data, boolean, bitmaps, unsigned/signed integers 8–64 bit, enums, floats, strings (octet/character, long variants), arrays/structures/sets/bags, time/date/UTC, cluster/attribute/BACnet OID, IEEE address, 128-bit security key; invalid/unknown values"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::types"
tests = ["type_ids_round_trip", "value_round_trips", "semi_precision_converts_both_ways", "composite_elements_iterate_and_build"]
notes = "All type identifiers, fixed-size types, strings and composite length walking; array / structure / set / bag values carry their raw encoding with element iteration (Value::elements), builders (write_array / write_struct) and the element selectors of the structured commands; semi-precision floats convert to and from single precision (IEEE 754 binary16, round to nearest even) and compare as magnitudes for reporting."
[[requirement]]
id = "PW-ZCL-FND-003"
section = "§2.5.1, §2.5.2"
summary = "Read Attributes / Read Attributes Response with per-attribute status"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::cluster"
tests = ["read_and_write_records", "read_write_and_discover_attributes"]

[[requirement]]
id = "PW-ZCL-FND-004"
section = "§2.5.3–§2.5.6"
summary = "Write Attributes, Write Attributes Undivided, Write Attributes Response, Write Attributes No Response; type checking, read-only, invalid value semantics"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::cluster"
tests = ["read_and_write_records", "read_write_and_discover_attributes"]
notes = "Range checks beyond the data type (step 5 of §2.5.3.3) are cluster-specific and left to the application."
[[requirement]]
id = "PW-ZCL-FND-005"
section = "§2.5.7, §2.5.8"
summary = "Configure Reporting / Response with min/max intervals, reportable change, timeout; direction semantics"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::cluster"
tests = ["reporting_records", "reporting_configuration_and_reports"]

[[requirement]]
id = "PW-ZCL-FND-006"
section = "§2.5.9, §2.5.10"
summary = "Read Reporting Configuration / Response"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::cluster"
tests = ["reporting_records", "reporting_configuration_and_reports"]

[[requirement]]
id = "PW-ZCL-FND-007"
section = "§2.5.11"
summary = "Report Attributes command generated by the reporting engine according to configuration"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::attribute"
tests = ["reporting_schedule", "reporting_configuration_and_reports"]
notes = "Reports are addressed via the binding table (Destination::Bound); timer consolidation of §2.5.11.2.5 is not applied (one deadline per attribute)."
[[requirement]]
id = "PW-ZCL-FND-008"
section = "§2.5.12"
summary = "Default Response generation rules (unicast, not for default responses, disable-default-response bit, error cases)"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::layer"
tests = ["default_responses_and_cluster_specific_commands"]

[[requirement]]
id = "PW-ZCL-FND-009"
section = "§2.5.13, §2.5.14"
summary = "Discover Attributes / Response with discovery complete flag"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::cluster"
tests = ["discovery_and_default_response", "read_write_and_discover_attributes"]

[[requirement]]
id = "PW-ZCL-FND-010"
section = "§2.5.15–§2.5.18"
summary = "Read/Write Attributes Structured"
level = "optional"
status = "implemented"
module = "panweave-zcl::structured"
tests = ["selectors_round_trip_and_reject_depth", "select_elements_and_counts", "replace_elements_and_resize_arrays", "sets_and_bags_add_and_remove", "read_structured_selects_elements_and_counts", "write_structured_replaces_adds_and_removes"]
notes = "Selectors (indicator nibbles, depth limited to 4 as the application limit §2.5.15.1.3 allows), element reads from arrays and structures with index 0 as the count, whole-attribute reads and writes through the plain rules, element replacement with INVALID_DATA_TYPE / INVALID_SELECTOR / READ_ONLY, set and bag add (DUPLICATE_EXISTS for sets) and remove (NOT_FOUND), the Write Attributes Structured Response with the failing attribute and selector and the lone SUCCESS record. Array lengths (index 0 writes) are read-only in the dispatcher: the content of new elements is application dependent and no fill hook is exposed (structured::replace accepts one)."
[[requirement]]
id = "PW-ZCL-FND-011"
section = "§2.5.19–§2.5.22"
summary = "Discover Commands Received/Generated and Discover Attributes Extended with responses"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::cluster"
tests = ["discovery_and_default_response", "read_write_and_discover_attributes"]

[[requirement]]
id = "PW-ZCL-FND-012"
section = "§2.6.3"
summary = "Status enumeration"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::frame"
tests = ["status_round_trip"]

[[requirement]]
id = "PW-ZCL-FND-013"
section = "§2.3.3, §2.4.2"
summary = "Manufacturer-specific clusters, attributes, commands; command direction and server/client roles; unsupported cluster/attribute/command handling"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::layer"
tests = ["default_responses_and_cluster_specific_commands", "group_delivery_targets_member_endpoints_only", "manufacturer_specific_clusters_need_their_code"]
notes = "Direction / role dispatch, UNSUPPORTED_CLUSTER and UNSUP_GENERAL_COMMAND; manufacturer-specific attributes and commands of standard clusters carry the code per attribute / command; manufacturer-specific clusters are registered with ClusterInstance::manufacturer_specific and addressed only by frames carrying their code (UNSUPPORTED_CLUSTER without one, UNSUP_MANUF_GENERAL_COMMAND / UNSUP_MANUF_CLUSTER_COMMAND with another), the responses echoing the code."
[[requirement]]
id = "PW-ZCL-FND-014"
section = "§2.3.2"
summary = "Global attributes: ClusterRevision, AttributeReportingStatus"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::cluster"
tests = ["multi_frame_reports_carry_attribute_reporting_status"]

# Clusters (chapter 3)
notes = "ClusterRevision is added to every instance; when a report does not fit one Report Attributes frame the last record of each frame is AttributeReportingStatus (Pending in all but the final frame, which carries Complete); single-frame reports carry no status."
[[requirement]]
id = "PW-ZCL-GEN-001"
section = "§3.2"
summary = "Basic cluster attributes and Reset to Factory Defaults command"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::basic"
tests = ["read_write_and_discover_attributes", "reset_to_factory_defaults_restores_attributes_and_reporting"]
notes = "Reset to Factory Defaults is executed by the endpoint dispatcher: every attribute of every cluster on every endpoint returns to its initial value and default reporting configuration, transient cluster state is cleared, and the application is told with ZclEvent::FactoryReset; network state, bindings and groups are untouched (§3.2.2.3.1)."
[[requirement]]
id = "PW-ZCL-GEN-002"
section = "§3.3"
summary = "Power Configuration cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::power_configuration"
tests = ["battery_thresholds_drive_alarm_state_and_codes", "mains_dwell_delays_the_alarm", "battery_sources_two_and_three_have_their_own_sets", "battery_alarm_reaches_the_bound_client_with_a_time_stamp"]
notes = "Mains and battery attributes for sources 1-3 (information, settings, thresholds; Table 3-27 layout through battery_attr / add_battery_source), BatteryAlarmState with reporting and per-source bits, the alarm masks and codes, threshold evaluation into BatteryAlarmState bits and Alarms codes, mains voltage threshold checks with the MainsVoltageDwellTripPoint timer run by the dispatcher (mains_tick raises through the Alarms server) and mains-lost handling. Readings come from the application (set_battery_source, set_mains_voltage, set_mains_available), which raises the battery alarms it is handed."
[[requirement]]
id = "PW-ZCL-GEN-003"
section = "§3.5"
summary = "Identify cluster: IdentifyTime attribute, Identify, Identify Query, Trigger Effect commands, Identify Query Response"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::identify"
tests = ["identify_server_countdown_and_query", "bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Server executed by the endpoint dispatcher: one-second countdown, Identify Query answered only while identifying, Trigger Effect surfaced to the application as an event (effect execution is application-defined)."
[[requirement]]
id = "PW-ZCL-GEN-004"
section = "§3.6"
summary = "Groups cluster: NameSupport, Add/View/Get Membership/Remove/Remove All/Add If Identifying and responses"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::groups"
tests = ["bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Server commands operate on apsGroupTable through GroupStore; group names are not supported (NameSupport bit 7 clear, View Group returns the null string); groupcast/broadcast deliveries generate no response (§3.6.2.3.1)."
[[requirement]]
id = "PW-ZCL-GEN-005"
section = "§3.7"
summary = "Scenes cluster with scene table, extension fields, transitions"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::scenes"
tests = ["scenes_store_recall_and_the_global_scene"]
notes = "Scene table of 16 entries per endpoint with the On/Off and Level Control extension field sets; Add/View/Remove/Remove All/Store/Recall/Get Scene Membership, Enhanced Add/View (tenths) and Copy Scene with the §3.7.2.4 status rules; groupcast/broadcast deliveries generate no response; scene names are not supported (NameSupport bit 7 clear); recall applies the field sets over the transition time through the Level Control engine; SceneValid tracks On/Off and Level changes; the global scene (0/0) backs Off With Effect / On With Recall Global Scene. LastConfiguredBy is not kept."
[[requirement]]
id = "PW-ZCL-GEN-006"
section = "§3.8"
summary = "On/Off cluster: OnOff, GlobalSceneControl, OnTime, OffWaitTime, StartUpOnOff; Off/On/Toggle/Off With Effect/On With Recall Global Scene/On With Timed Off"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::on_off"
tests = ["default_responses_and_cluster_specific_commands", "on_with_timed_off_counts_down_and_guards_the_off_state", "scenes_store_recall_and_the_global_scene"]
notes = "Executed by the endpoint dispatcher: Off/On/Toggle with the OnTime/OffWaitTime rules, Off With Effect (global scene stored, effect surfaced as ZclEvent::OffWithEffect), On With Recall Global Scene, On With Timed Off with the 100 ms countdown read literally from §3.8.2.3.6.4 (an expired OnTime clears OffWaitTime; an Off command during the timed-on period keeps the guard), GlobalSceneControl per §3.8.2.2.2, StartUpOnOff applied by on_off::start_up when the application supplies the previous value (attributes are not persisted by the stack). OnOff carries the BDB default reporting configuration."
[[requirement]]
id = "PW-ZCL-GEN-007"
section = "§3.10"
summary = "Level Control cluster: CurrentLevel and related attributes; Move to Level, Move, Step, Stop (with/without On/Off), transitions and rate semantics"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::level"
tests = ["level_transitions_run_on_the_tick_and_couple_with_on_off", "scenes_store_recall_and_the_global_scene"]
notes = "Move to Level / Move / Step / Stop and the with-On/Off variants with OptionsMask/OptionsOverride and ExecuteIfOff processing; linear transitions driven by the dispatcher's 100 ms tick with RemainingTime; Rate 0xff uses DefaultMoveRate; clamped steps shorten proportionally; with-On/Off commands set OnOff (and GlobalSceneControl) per §3.10.2.3.6; Table 3-55 On/Off fades with OnLevel/On-/OffTransitionTime and restoration of the stored level (applied on a change of OnOff only); CurrentFrequency / Move to Closest Frequency are not implemented; StartUpCurrentLevel is applied by level::start_up on the application's request."
[[requirement]]
id = "PW-ZCL-GEN-008"
section = "§3.11"
summary = "Alarms cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::alarms"
tests = ["table_and_commands", "battery_alarm_reaches_the_bound_client_with_a_time_stamp"]
notes = "Alarm table (oldest replaced when full), AlarmCount, Reset Alarm / Reset All Alarms (handed to the application as ZclEvent::AlarmReset), Get Alarm / Get Alarm Response and Reset Alarm Log executed by the dispatcher; Zcl::raise_alarm logs and sends the Alarm command to bound clients, time-stamped from a Time server on the same endpoint."
[[requirement]]
id = "PW-ZCL-GEN-009"
section = "§3.12"
summary = "Time cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::time"
tests = ["clock_runs_and_guards_writes", "battery_alarm_reaches_the_bound_client_with_a_time_stamp"]
notes = "Time, TimeStatus (fixed Master / MasterZoneDst bits, Synchronized cleared on a master), TimeZone, DstStart / DstEnd / DstShift, StandardTime, LocalTime, LastSetTime and ValidUntilTime; the clock runs on the dispatcher's monotonic time, a network write of Time is refused on a master clock (READ_ONLY) and otherwise applied as the new base with ZclEvent::TimeSet; the zone attributes are read-only under MasterZoneDst. The client-side server selection rules of §3.12.2.2.2 are documented, not automated."
[[requirement]]
id = "PW-ZCL-GEN-010"
section = "§3.15"
summary = "Diagnostics cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::diagnostics"
tests = ["ias_zone_auto_enroll_request_and_status_notification"]
notes = "Every attribute of section 3.15.2.2 is instantiated by diagnostics::server and Stack::refresh_diagnostics fills it from the stack counters: MAC broadcast / unicast rx and tx, retries, failures and transmit queue overflows (MacService::stats), APS broadcast / unicast rx and tx, successes, retries, failures and frame counter failures, NWK frame counter and decryption failures, unauthorized keys, buffer allocation failures, relayed unicasts, validation drops, route discoveries initiated, neighbor table additions / removals / stale entries, join indications, children moved, the average MAC retries per APS message and the LQI / RSSI of the last frame. NumberOfResets and PersistentMemoryWrites are supplied by the application through Counters."
[[requirement]]
id = "PW-ZCL-GEN-011"
section = "§3.16"
summary = "Poll Control cluster: check-in, fast polling, long/short poll intervals"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::poll_control"
tests = ["poll_control_server_checks_in_and_fast_polls", "poll_control_check_in_puts_the_sleepy_device_into_fast_poll_mode"]
notes = "Server: Table 3-132 attributes with the CheckInInterval/FastPollTimeout write validation, Check-in to the bound clients at a constant CheckInInterval (§3.16.6.1, re-armed when the attribute changes), temporary fast poll mode for 7.68 s awaiting responses, Check-in Response (longest timeout wins, INVALID_FIELD above FastPollTimeoutMax, FAILURE when late), Fast Poll Stop, Set Long/Short Poll Interval with the §3.16.4.2 relationships; the runtime switches the MAC poll rate on ZclEvent::FastPoll / LongPollInterval. Client: answers Check-ins with a configured policy and raises ZclEvent::CheckIn. The 'unbound client → FAILURE' SHOULD is not enforced (the dispatcher does not see the binding table)."
[[requirement]]
id = "PW-ZCL-GEN-012"
section = "§3.4"
summary = "Device Temperature Configuration cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::configuration"
tests = ["device_temperature_alarms_after_the_dwell"]
notes = "Information and settings sets, extremes tracked from readings, LowTempThreshold / HighTempThreshold consistency and range guards, the mask, and the Low / High dwell trip points run as timers by the dispatcher, raising alarm codes 0x00 / 0x01 through the endpoint Alarms server. OverTempTotalDwell is the application's to accumulate."
[[requirement]]
id = "PW-ZCL-GEN-013"
section = "§3.9"
summary = "On/Off Switch Configuration cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::configuration"
tests = ["switch_configuration_maps_actions_to_commands"]
notes = "SwitchType and SwitchActions with the Table 3-54 mapping to On / Off / Toggle (command_for); the switch state transitions themselves come from the application."
[[requirement]]
id = "PW-ZCL-GEN-014"
section = "§3.13"
summary = "RSSI Location cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::rssi_location"
tests = ["codecs_round_trip", "server_answers_and_schedules", "location_requests_are_answered_and_repeated", "pings_rssi_reports_and_anchors"]
notes = "Location Information (LocationType bit fields, LocationMethod, LocationAge, QualityMeasure, NumberOfDevices) and Location Settings (Coordinate1-3, Power, PathLossExponent, ReportingPeriod, CalculationPeriod, NumberRSSIMeasurements) attributes; codecs for the seven received and eight generated commands including the conditional fields of the location data (Coordinate 3 for 3-D, the calculation fields for measured locations, the compact form). Server behaviour in the dispatcher: Set Absolute Location and Set Device Configuration update the attributes (the latter refused with FAILURE for an absolute location, §3.13.2.3.2 names no status); Get Device Configuration and Get Location Data are answered for the device's own IEEE address (the instance state) and NOT_FOUND for others, a broadcast asking for absolute locations from a measured device is not answered, Number Responses > 1 sends the follow-ups as Location Data / Compact Location Data Notifications every ReportingPeriod (1 s when 0), unicast to the requester or broadcast; Send Pings blasts NumberRSSIMeasurements RSSI Pings CalculationPeriod apart; RSSI Responses are collected per neighbour and reported to the bound central device as Report RSSI Measurements after CalculationPeriod; ReportingPeriod > 0 sends periodic Location Data Notifications to the bound clients; Anchor Node Announce and a recalculate request reach the application. Not done: the recommended broadcast radius 1 for pings and notifications (the ZCL layer has no per-frame radius; TODO(PW-ZCL-RSSI-RADIUS)) and locations of third devices (Get Location Data for another address answers NOT_FOUND). The client side is codecs only (the application performs the localization algorithm)."
[[requirement]]
id = "PW-ZCL-GEN-015"
section = "§3.14"
summary = "Analog / Binary / Multistate Input, Output and Value clusters"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::io"
tests = ["analog_input_is_writable_out_of_service_and_flags_follow", "binary_output_and_multistate_value"]
notes = "All nine clusters (0x000c–0x0014) as servers of one Kind: OutOfService, PresentValue (single / bool / uint16, reported), StatusFlags (reported; Fault from Reliability, Out Of Service from OutOfService, Overridden from the application), Reliability, Description; EngineeringUnits, Min / MaxPresentValue and Resolution for analog kinds, Polarity and the active / inactive texts for binary kinds, NumberOfStates for multistate kinds, RelinquishDefault and the minimum on / off times for outputs and values. An input PresentValue is writable over the air only while out of service (NOT_AUTHORIZED otherwise) and ignores physical readings then. PriorityArray and StateText (arrays) are not instantiated: a PresentValue write is the priority-16 write; ApplicationType is defined but not instantiated; the In Alarm flag stays clear (no EventState cluster)."
[[requirement]]
id = "PW-ZCL-GEN-016"
section = "§3.17"
summary = "Power Profile cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::power_profile"
tests = ["codecs_round_trip", "server_answers_requests_and_applies_schedules", "power_profile_is_forecast_scheduled_and_priced"]
notes = "TotalProfileNum, MultipleScheduling, EnergyFormatting, EnergyRemote and ScheduleMode (writable, reportable); codecs for every §3.17.5 / §3.17.6 command (Power Profile Notification / Response with up to 7 energy phases per frame, State Response / Notification records, Get Power Profile Price (Extended) and Overall Schedule Price with their responses, Energy Phases Schedule Notification / Response / Request / State Response / State Notification, Schedule Constraints Notification / Response / Request). The server keeps up to four profiles (forecast, current record, accepted schedule, constraints) in the cluster instance; the dispatcher answers the four requests (NOT_FOUND for an unknown profile, all profiles for ID 0), applies received schedules (NOT_AUTHORIZED when the profile is not remotely controllable or a phase has MaxActivationDelay 0, NOT_FOUND for an unknown phase, PROGRAMMED → ENERGY_PHASE_WAITING_TO_START, Energy Phases Schedule State Notification when the schedule changed) and hands prices to the application (ZclEvent::PowerProfilePrice / PowerProfileOverallPrice). The application sets forecasts, states, remote control and constraints and asks for schedules and prices through the Zcl::power_profile_* helpers; the client side (scheduler) is codecs only. Profiles longer than 7 phases need the Partition cluster (not implemented)."
[[requirement]]
id = "PW-ZCL-GEN-017"
section = "§3.19, §3.20"
summary = "Level Control for Lighting and Pulse Width Modulation clusters"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::level"
tests = ["frequency_lighting_and_pwm", "level_couples_the_colour_temperature_and_pwm_runs_beside_it"]
notes = "Level Control for Lighting: lighting_server enforces the 1…0xfe level range; the CoupleColorTempToLevel Options bit couples CurrentLevel to ColorTemperatureMireds in colour temperature mode (full level = CoupleColorTempToLevelMinMireds, minimum level = ColorTempPhysicalMaxMireds, linear between) through the dispatcher. The frequency attributes and Move to Closest Frequency (approximated by clamping into MinFrequency…MaxFrequency; INVALID_VALUE beyond half / double the range or zero) on the base cluster; Pulse Width Modulation (0x001c) as pwm_server over the same transition engine with a 0…100 % duty cycle, its own commands and ZclEvent::DutyCycle / Frequency. Not done: the Level Control couplings of §3.19.4 beyond Table 3-55 are examples only; StateText-style semantics do not apply."
[[requirement]]
id = "PW-ZCL-MEAS-001"
section = "§4.2–§4.8"
summary = "Measurement clusters: Illuminance, Illuminance Level Sensing, Temperature, Pressure, Flow, Water Content (humidity), Occupancy Sensing"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::measurement"
tests = ["servers_hold_and_report_readings", "temperature_sensor_reports_through_its_default_configuration"]
notes = "Attribute-only servers with the §4.1.3 range attributes, unknown / invalid markers, default reporting of the measured value (BDB 3.1 §6.5) and application setters: Illuminance Measurement, Illuminance Level Sensing, Temperature, Pressure (incl. the extended scaled set definitions), Flow, Water Content (Relative Humidity / Leaf Wetness / Soil Moisture) and Occupancy Sensing with the sensor-type alignment of Table 4-24; facade endpoints for the Light, Occupancy and Temperature Sensor devices. The occupancy delay / threshold attributes are defined but not instantiated by default."
[[requirement]]
id = "PW-ZCL-MEAS-002"
section = "§4.9"
summary = "Electrical Measurement cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::electrical_measurement"
tests = ["dc_server_tracks_extremes_and_alarms", "ac_server_readings_and_alarms", "profile_codecs_round_trip", "polyphase_totals_harmonics_and_voltage_quality"]
notes = "MeasurementType, the DC set (readings, minima / maxima, formatting, overload mask and thresholds) and the single-phase / phase A AC set (frequency, RMS voltage with extremes, RMS current and active power with extremes once enabled, reactive / apparent power, power factor, formatting, ACAlarmsMask with the voltage / current / active / reactive power overload thresholds and the average / extreme over and under voltage, sag and swell thresholds with the over / under voltage counters and period attributes), the AC non-phase-specific set (frequency extremes, neutral current, polyphase totals, harmonic and phase harmonic currents with their multipliers) and the phase B / C sets over the phase A layout (Tables 4-39 / 4-40); readings fed by the application with the alarm codes (the mask bit numbers) to raise through the Alarms cluster; Get Profile Info / Get Measurement Profile request and response codecs, the profile itself left to the application. The runtime's 36-attribute instances hold one phase with the overloads; polyphase servers need a larger attribute capacity. Averaging over AverageRMSVoltageMeasurementPeriod and the period attributes are the application's to maintain."
[[requirement]]
id = "PW-ZCL-MEAS-003"
section = "§4.10–§4.13"
summary = "Electrical Conductivity, pH, Wind Speed and Concentration Measurement clusters"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::measurement"
tests = ["scalar_and_concentration_servers"]
notes = "Electrical Conductivity (0x040a, 10 x mS/m), pH (0x0409, 100 x pH up to 0x0578) and Wind Speed (0x040b, 100 x m/s) as uint16 servers with the §4.1.3 range attributes and default reporting; the Concentration Measurement clusters 0x040c–0x0429 as single-precision fraction-of-one servers with NaN as the unknown value and a floating-point reportable change. Tolerance is defined but not instantiated by default."
[[requirement]]
id = "PW-ZCL-LIGHT-001"
section = "§5.2"
summary = "Color Control cluster: hue/saturation, XY, color temperature, enhanced hue, color loop, commands and transitions"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::color_control"
tests = ["hue_directions_and_timed_transition", "xy_temperature_and_color_loop", "color_control_through_the_dispatcher_and_scenes", "level_couples_the_colour_temperature_and_pwm_runs_beside_it", "primaries_color_points_and_drift_compensation"]
notes = "Colour information attributes per ColorCapabilities, the Options / OptionsMask / OptionsOverride and ExecuteIfOff rules, Move to / Move / Step for hue (8-bit and enhanced, with the shortest / longest / up / down directions on the hue circle), saturation, XY and colour temperature (physical and per-command bounds, clipping), Move to Hue and Saturation, Color Loop Set with the update flags and stored hue, Stop Move Step, RemainingTime, the scene extension field set, StartUpColorTemperatureMireds and the Level Control coupling of §5.2.2.1.1 (CoupleColorTempToLevel), executed by the dispatcher on a 100 ms tick; the Defined Primaries / Additional Defined Primaries sets (up to six primaries), the Defined Colour Points set with the white point and DriftCompensation / CompensationText as optional extensions of a server (the runtime's 36-attribute instances hold a full-capability lamp without the primaries sets). The colour-mode conversions of §5.2.2.3.2 are manufacturer dependent as the specification states: a command in another colour mode starts from that mode's current attributes."
[[requirement]]
id = "PW-ZCL-LIGHT-002"
section = "§5.3"
summary = "Ballast Configuration cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::configuration"
tests = ["ballast_levels_factor_and_burn_hours"]
notes = "Ballast information / settings and lamp information / settings sets with the MinLevel / MaxLevel / factor / string-length guards of §5.3.2.2, the dimming curve output_for_level (linear between MinLevel and MaxLevel scaled by BallastFactorAdjustment), BallastStatus and the LampBurnHours trip-point alarm (code 0x01) counted by add_burn_hours; facade Dimmable Ballast device. PowerOnLevel / PowerOnFadeTime (deprecated) are defined but not instantiated."
[[requirement]]
id = "PW-ZCL-HVAC-001"
section = "§6.3, §6.4"
summary = "Thermostat and Fan Control clusters"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::hvac"
tests = ["setpoints_limits_dead_band_and_running_mode", "weekly_schedule_set_get_clear", "weekly_schedule_runs_against_the_clock", "setpoint_tracking_ac_information_and_relay_log", "fan_modes_follow_the_sequence"]
notes = "Thermostat information and settings attributes with the setpoint limit, dead-band and control-sequence rules enforced on writes, Setpoint Raise/Lower executed by the dispatcher (ZclEvent::Setpoints), the Table 6-17 running mode (EmergencyHeatDelta selecting emergency heat), the scene extension field set and heating-only / cooling-only / dual builders; the weekly schedule extension (StartOfWeek, NumberOfWeeklyTransitions, NumberOfDailyTransitions, TemperatureSetpointHold; Set / Get / Clear Weekly Schedule with INSUFFICIENT_SPACE, INVALID_VALUE, FAILURE and INVALID_FIELD refusals, Get Weekly Schedule Response) run against the endpoint Time server per ADR-0015; the setpoint change tracking set (source, amount, UTC timestamp, setbacks clamped into their bounds on write, EmergencyHeatDelta), the AC information set with TemperatureSetpointHoldDuration, ThermostatProgrammingOperationMode (reported) and ThermostatRunningState, and the relay status log (record_relay_status FIFO, Get Relay Status Log answered LIFO with the unread count, the newest again once read out); Fan Control with FanMode validated against FanModeSequence; facade Thermostat device. The relay bit mapping, humidity sampling and hold-duration expiry are the application's; the schedule runs only while ThermostatProgrammingOperationMode bit 0 (schedule programming) is set when that attribute is present."
[[requirement]]
id = "PW-ZCL-HVAC-002"
section = "§6.2, §6.5, §6.6"
summary = "Pump Configuration and Control, Dehumidification Control and Thermostat User Interface Configuration clusters"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::configuration"
tests = ["pump_modes_status_and_alarms", "dehumidification_demand_follows_setpoint_and_hysteresis", "thermostat_ui_and_shade_guards"]
notes = "Pump Configuration and Control: the mandatory information, dynamic and settings attributes (optional limits definable), OperationMode / ControlMode guards, the Figure 6-3 effective-mode resolution with remote sensors, PumpStatus bits, Capacity / Speed / Running updates and the Table 6-9 alarm codes gated by AlarmMask; Dehumidification Control with the range guards and a setpoint-plus-hysteresis demand; Thermostat User Interface Configuration with the value guards. The pump's own regulation loop and the Level Control setpoint coupling are the application's."
[[requirement]]
id = "PW-ZCL-CLOS-001"
section = "§7.3, §7.4"
summary = "Door Lock and Window Covering clusters"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::window_covering"
tests = ["lock_operations_follow_mode_actuator_and_pin_rules", "wrong_codes_lock_the_lock_out_and_raise_the_tamper_alarm", "unlock_with_timeout_and_auto_relock_lock_again", "pin_user_table_commands", "rfid_codes_share_the_user_table", "schedules_gate_the_users_and_holidays_switch_the_mode", "the_log_records_events_when_enabled", "pin_programming_unlock_with_timeout_and_auto_relock", "commands_are_validated_against_the_control", "scenes_become_timed_go_to_commands", "go_to_lift_percentage_reaches_the_application_and_the_position_is_reported"]
notes = "Door Lock (§7.3): information / operational / security / event-mask attributes (user and schedule counts, PIN and RFID lengths, EnableLogging, SecurityLevel, Language / LED / sound with guards), Lock, Unlock, Toggle and Unlock with Timeout with the operating-mode (Privacy and No RF refuse with FAILURE), ActuatorEnabled, RequirePINforRFOperation, WrongCodeEntryLimit lockout (tamper alarm 4 via the Alarms cluster) and AutoRelockTime rules; a bounded user table with PIN and RFID codes (Set / Get / Clear / Clear All for both, Set / Get User Status and Type; clearing one code keeps a user holding the other), week day and year day schedules per user (Set / Get / Clear with INVALID_FIELD / NOT_FOUND responses) that gate schedule-type users at RF operations against the endpoint clock (invalid-schedule events, refused without a clock), holiday schedules switching OperatingMode from the dispatcher tick and restoring it afterwards, Operation and Programming Event Notifications gated by the masks with codes masked unless SendPINOverTheAir, an eight-record FIFO event log served by Get Log Record when EnableLogging is set, the SecurityLevel = APS policy (commands without APS security answer NOT_AUTHORIZED) and the LockState scene extension as a delayed operation. Keypad / manual events come from the application (door_lock_operation_event). Window Covering (§7.4): information and settings attributes, open-/closed-loop lift and tilt, the seven commands with INVALID_VALUE / UNSUPPORTED_COMMAND validation and the Mode maintenance bit (refused with FAILURE, a status the spec does not name for this case), Mode reversal mirrored into ConfigStatus, percentage reporting by default, the scene extension recalled as a timed go-to command (ZclEvent::WindowCovering); Go To Value accepts any value between the two installed limits whichever is larger; intermediate setpoint strings and the velocity / acceleration attributes are not instantiated."
[[requirement]]
id = "PW-ZCL-CLOS-002"
section = "§7.2, §7.5"
summary = "Shade Configuration and Barrier Control clusters"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::configuration"
tests = ["thermostat_ui_and_shade_guards", "barrier_commands_events_and_safety"]
notes = "Shade Configuration (information and settings sets, Status with only the motor-direction bit writable, Mode and ClosedLimit guards, set_motion); Barrier Control with Go To Percent / Stop executed by the dispatcher (ZclEvent::Barrier, INVALID_VALUE for partial positions without the capability, FAILURE under Remote Lockout), the open / close and command event counters that stick at 0xfffe, SafetyStatus changes reported as alarm codes, reporting of MovingState / SafetyStatus / BarrierPosition and the BarrierPosition scene field. The OpenPeriod / ClosePeriod watchdog is the application's."
[[requirement]]
id = "PW-ZCL-IAS-001"
section = "§8.2"
summary = "IAS Zone cluster: enrolment (auto/trip-to-pair), zone status change notification, enroll request/response"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::ias_zone"
tests = ["auto_enroll_request_flow_and_notifications", "trip_to_pair_requests_on_status_change", "ias_zone_auto_enroll_request_and_status_notification"]
notes = "Zone information / settings attributes, the three enrolment procedures (Trip-to-Pair via Zcl::request_zone_enrollment or a status change while unenrolled, Auto-Enroll-Response, Auto-Enroll-Request on the IAS_CIE_Address write), Zone Status Change Notification with the Delay field, Zone Enroll Request / Response, Initiate Normal Operation / Test Mode with the Test bit and sensitivity level, all executed by the dispatcher (ZclEvent::ZoneEnrolled / ZoneTestMode). Sender authentication uses the network address of the node that wrote IAS_CIE_Address (the dispatcher has no IEEE resolution); the NOT_AUTHORIZED rejection of ZDO bind requests from other nodes (§8.2.2.1.3) is not implemented."
[[requirement]]
id = "PW-ZCL-IAS-002"
section = "§8.3, §8.4"
summary = "IAS ACE and IAS WD clusters"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::ias_wd"
tests = ["zone_queries_answer_from_the_table", "arm_validates_the_code_and_tracks_the_panel", "bypass_results_and_the_list_cleared_on_disarm", "emergencies_and_status_changes", "warning_round_trips_and_is_clamped", "squawk_round_trips", "keypad_arms_the_cie_which_warns_the_siren_and_relays_zone_status"]
notes = "IAS ACE (§8.3): a bounded zone table (16 entries; the spec allows 255) with panel status, bypass list and arm/disarm code (redacted Debug, constant-time compare); Get Zone ID Map, Get Zone Information, Get Panel Status, Get Bypassed Zone List (Set Bypassed Zone List) and Get Zone Status (mask flag, paging) answered by the dispatcher; Arm with Invalid Code / Already Disarmed / Not Ready notifications and the panel status transition, disarming clearing the bypass list (§8.3.2.4.7.4); Bypass with the Table 8-18 results; Emergency / Fire / Panic to the application (ZclEvent::Ace); Zone Status Changed and Panel Status Changed to the bound clients from the application helpers, and a CIE endpoint's IAS Zone client relaying Zone Status Change Notifications into the panel. The per-second Panel Status Changed during arming delays is the application's (it calls ace_set_panel_status). IAS WD (§8.4): MaxDuration, Start Warning (duration clamped, duty cycle rounded to tens, a new command ending the previous one, expiry timer → ZclEvent::Warning None), Squawk ignored while warning."
[[requirement]]
id = "PW-ZCL-OTA-001"
section = "§11"
summary = "OTA Upgrade cluster: image notify, query next image, image block/page, upgrade end, file format, signature verification"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::ota"
tests = ["header_and_sub_elements_round_trip", "download_flow_between_client_and_server", "page_request_is_served_block_by_block", "wait_forever_is_requeried_hourly_then_applied", "device_specific_file_request_round_trips", "client_downloads_verifies_and_is_told_when_to_upgrade", "client_discovers_the_first_server_and_stores_its_ieee_address", "preprogrammed_server_is_located_by_address", "an_idle_client_polls_the_server_periodically"]
notes = "OTA file header (mandatory and optional fields, suitability checks) and sub-element iteration, the client attributes, codecs for every §11.13 command (Image Notify, Query Next Image, Image Block / Page Request, Image Block Response, Upgrade End, Query Device Specific File), the Table 11-15 time interpretation, a client download machine (notify jitter and matching rules, query, block requests with rate limiting and waits, out-of-order block re-requests, verify hand-off, Upgrade End, activation policy, the §11.16 hourly re-query while waiting indefinitely with self-applied upgrade after three unanswered queries), server helpers answering from an ImageSource including PageService for Image Page Request (§11.13.7.4), and upgrade server discovery per §11.8 (Stack::discover_ota_server: NWK_addr_req for a preprogrammed UpgradeServerID, else Match_Desc_req then IEEE_addr_req, application link key requested for a non-Trust-Center server); simulator tests download a 300-octet image and discover servers. The idle client polls the server every application-set period (Client::with_query_period, §11.8.2 / §11.13.4), re-armed after each answer. The ECDSA signature verification of §11.6–§11.7 is the host's (the client hands the downloaded image to the application for verification before Upgrade End, ADR-0012: no hand-rolled ECC), and the periodic rediscovery of the upgrade server (§11.8) is the application's call on Stack::discover_ota_server."
[[requirement]]
id = "PW-ZCL-COMM-001"
section = "§13.2"
summary = "Commissioning cluster (startup attribute set)"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::commissioning"
tests = ["attributes_round_trip_and_keys_are_write_only", "consistency_per_startup_control", "restart_checks_consistency_and_reports_the_set", "save_restore_reset", "saved_sets_round_trip_through_storage", "writes_are_guarded", "tool_writes_the_startup_set_and_restarts_the_router_into_a_silent_join"]
notes = "The startup parameters, join, end-device and concentrator attribute sets (TrustCenterMasterKey omitted); NetworkKey and PreconfiguredLinkKey are write-only (reads answer NOT_AUTHORIZED per §13.2.2.2.1) and redacted; write guard for StartupControl / ShortAddress / PANId / StackProfile and the rejoin-without-EPID FAILURE (§13.2.2); Restart Device with the Table 13-5 consistency check, the response before the restart, StackEvent::Restart and the stack restarting itself after delay + RAND(jitter x 80 ms) (install the set, or resume the running configuration); Save / Restore / Reset Startup Parameters over a two-entry store kept in non-volatile storage (Kind::StartupSets, restored on warm start) with the §13.2.2.3.4 option semantics. Stack::restart_from_startup_set forms / silently adopts / rejoins / associates after the leave completes and wires ScanAttempts, TimeBetweenScans, RejoinInterval, MaxRejoinInterval, ParentRetryThreshold, IndirectPollRate and the concentrator parameters into the stack configuration; the seeded set comes from the live NIB."
[[requirement]]
id = "PW-ZCL-COMM-002"
section = "§13.3"
summary = "Touchlink commissioning cluster (inter-PAN commands, utility commands)"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::touchlink"
tests = ["scan_request_and_response_round_trip", "start_join_update_round_trip", "information_and_utility_round_trip", "update_id_comparison_handles_wrap", "certification_key_test_vectors", "development_key_test_vector"]
notes = "Codecs of every inter-PAN command (Scan Request / Response with the single sub-device fields, Device Information Request / Response, Identify, Reset To Factory New, Network Start / Join Router / Join End Device Requests and Responses, Network Update Request) and the utility commands (Endpoint Information, Get Group Identifiers, Get Endpoint List), the ZigBee and Touchlink information fields, the constants of Table 13-21, the nwkUpdateId comparison of §13.3.4.10 and the key transport algorithms of §13.3.4.11 in panweave-security::touchlink (development, master, certification; the published test vectors pass). The utility commands are codecs only: the dispatcher does not answer Get Group Identifiers / Get Endpoint List (TODO(PW-ZCL-TOUCHLINK-UTILITY))."
[[requirement]]
id = "PW-ZCL-MTRID-001"
section = "§10.13"
summary = "Meter Identification cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::meter_identification"
tests = ["server_carries_the_mandatory_set"]
notes = "The twelve attributes of Table 10-215 (CompanyName, MeterTypeID, DataQualityID, CustomerName (writable), Model, PartNumber, ProductRevision, SoftwareRevision, UtilityName, POD, AvailablePower, PowerThreshold) with the Meter Type and Data Quality enumerations; the server builder takes the mandatory set. The cluster has no commands."

[[requirement]]
id = "PW-ZCL-APPL-001"
section = "§15"
summary = "Appliance Management clusters: EN50523 Appliance Control, Appliance Identification, Appliance Events and Alerts, Appliance Statistics"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::appliance"
tests = ["control_codecs_round_trip", "control_server_handles_commands", "identification_packs_the_basic_fields", "alerts_are_recorded_and_answered", "statistics_queue_serves_log_requests", "appliance_control_is_executed_by_the_application", "alerts_events_and_logs_are_notified_and_served"]
notes = "Appliance Control (§15.2): StartTime / FinishTime / RemainingTime with the Table 15-4 time encoding, Execution of a Command (ZclEvent::ApplianceCommand), Signal State answered from the stored signal state (status, remote enable flags, device status 2 structure, optional 24-bit status 2), Write Functions records (codec; the command is handed to the application, which owns the functions), Overload Pause / Resume / Warning (ZclEvent::ApplianceOverload), Signal State Notification to the bound clients from Zcl::appliance_signal_state. Appliance Identification (§15.3): BasicIdentification packing (company, brand, product type, CECED version) and the extended attribute definitions. Events and Alerts (§15.4): a 15-entry alert list (present replaces, recovery removes), Get Alerts answered by the dispatcher, Alerts Notification and Event Notification from Zcl::appliance_alert / appliance_event. Statistics (§15.5): LogMaxSize (70) / LogQueueMaxSize (8), an 8-entry log queue with consecutive Log IDs, Log Notification on Zcl::appliance_log (time-stamped from a Time server on the endpoint, else 0xffffffff), Log Request (NOT_FOUND for an unknown id), Log Queue Request and Statistics Available. Bulk logs over the Partition cluster are not supported (the cluster is not implemented, PW-ZCL-MISC-001)."

[[requirement]]
id = "PW-ZCL-MISC-001"
section = "§9, §12, §14"
summary = "Protocol interface (Generic / BACnet / ISO 7818 tunnels, Partition), telecommunications and retail clusters"
level = "optional"
status = "partially-implemented"
module = "panweave-zcl::clusters::partition"
tests = ["codecs_round_trip", "a_large_frame_crosses_a_lossless_link_in_acknowledged_groups", "lost_blocks_are_named_by_the_multiple_ack_and_resent", "a_sender_without_acknowledgements_gives_up"]
notes = "The Partition cluster (§9.6) is implemented in panweave-zcl::clusters::partition: the Table 9-29 attributes with the defaults derived from apsAckWaitDuration and apsInterframeDelay, the TransferPartitionedFrame / MultipleACK / ReadHandshakeParam / WriteHandshakeParam / ReadHandshakeParamResponse codecs, and the Sender / Receiver state machines (groups of NumberOfACKFrame blocks, NACK-driven resends, NumberOfSendRetries on SenderTimeout, NACKTimeout and ReceiverTimeout on the receiver, unacknowledged mode); blocks are numbered from 0 with the first block's indicator carrying the total and NACKIds carrying block indices (an interpretation of §9.6.3.3.1 / §9.6.3.4.1). The handshake records are handled with the ordinary attribute codecs; the registration table of clusters using Partition (Table 9-32) is the application's. The Generic Tunnel (§9.2), BACnet Protocol Tunnel (§9.3), ISO 7816 (§9.4) and telecommunication / information (§12) / EN 50523 appliance (§14) clusters remain metadata only."
