module = "panweave-zcl::layer"
tests = ["default_responses_and_cluster_specific_commands", "group_delivery_targets_member_endpoints_only"]
notes = "Direction/role dispatch, UNSUPPORTED_CLUSTER and UNSUP_GENERAL_COMMAND are implemented; manufacturer-specific attributes are supported in the store, manufacturer-specific cluster registration is not distinguished from standard clusters."
