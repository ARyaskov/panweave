# Clusters (chapter 3)
notes = "ClusterRevision is added to every instance; AttributeReportingStatus is defined but not emitted."
[[requirement]]
id = "PW-ZCL-GEN-001"
section = "§3.2"
summary = "Basic cluster attributes and Reset to Factory Defaults command"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::basic"
tests = ["read_write_and_discover_attributes", "reset_to_factory_defaults_restores_attributes_and_reporting"]
notes = "Reset to Factory Defaults is executed by the endpoint dispatcher: every attribute of every cluster on every endpoint returns to its initial value and default reporting configuration, transient cluster state is cleared, and the application is told with ZclEvent::FactoryReset; network state, bindings and groups are untouched (§3.2.2.3.1)."
[[requirement]]
id = "PW-ZCL-GEN-002"
section = "§3.3"
summary = "Power Configuration cluster"
level = "optional"
status = "partially-implemented"
module = "panweave-zcl::clusters::power_configuration"
tests = ["battery_thresholds_drive_alarm_state_and_codes", "battery_alarm_reaches_the_bound_client_with_a_time_stamp"]
notes = "Mains and battery source 1 attributes (information, settings, thresholds, BatteryAlarmState with reporting), the alarm masks and codes, threshold evaluation into BatteryAlarmState bits and Alarms codes, mains voltage threshold checks and mains-lost handling. Battery sources 2 and 3 (0x0040-0x007e) are not instantiated and the MainsVoltageDwellTripPoint timer is left to the application."
[[requirement]]
id = "PW-ZCL-GEN-003"
section = "§3.5"
summary = "Identify cluster: IdentifyTime attribute, Identify, Identify Query, Trigger Effect commands, Identify Query Response"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::identify"
tests = ["identify_server_countdown_and_query", "bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Server executed by the endpoint dispatcher: one-second countdown, Identify Query answered only while identifying, Trigger Effect surfaced to the application as an event (effect execution is application-defined)."
[[requirement]]
id = "PW-ZCL-GEN-004"
section = "§3.6"
summary = "Groups cluster: NameSupport, Add/View/Get Membership/Remove/Remove All/Add If Identifying and responses"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::groups"
tests = ["bdb_formation_steering_finding_binding_and_rejoin"]
notes = "Server commands operate on apsGroupTable through GroupStore; group names are not supported (NameSupport bit 7 clear, View Group returns the null string); groupcast/broadcast deliveries generate no response (§3.6.2.3.1)."
[[requirement]]
id = "PW-ZCL-GEN-005"
section = "§3.7"
summary = "Scenes cluster with scene table, extension fields, transitions"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::scenes"
tests = ["scenes_store_recall_and_the_global_scene"]
notes = "Scene table of 16 entries per endpoint with the On/Off and Level Control extension field sets; Add/View/Remove/Remove All/Store/Recall/Get Scene Membership, Enhanced Add/View (tenths) and Copy Scene with the §3.7.2.4 status rules; groupcast/broadcast deliveries generate no response; scene names are not supported (NameSupport bit 7 clear); recall applies the field sets over the transition time through the Level Control engine; SceneValid tracks On/Off and Level changes; the global scene (0/0) backs Off With Effect / On With Recall Global Scene. LastConfiguredBy is not kept."
[[requirement]]
id = "PW-ZCL-GEN-006"
section = "§3.8"
summary = "On/Off cluster: OnOff, GlobalSceneControl, OnTime, OffWaitTime, StartUpOnOff; Off/On/Toggle/Off With Effect/On With Recall Global Scene/On With Timed Off"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::on_off"
tests = ["default_responses_and_cluster_specific_commands", "on_with_timed_off_counts_down_and_guards_the_off_state", "scenes_store_recall_and_the_global_scene"]
notes = "Executed by the endpoint dispatcher: Off/On/Toggle with the OnTime/OffWaitTime rules, Off With Effect (global scene stored, effect surfaced as ZclEvent::OffWithEffect), On With Recall Global Scene, On With Timed Off with the 100 ms countdown read literally from §3.8.2.3.6.4 (an expired OnTime clears OffWaitTime; an Off command during the timed-on period keeps the guard), GlobalSceneControl per §3.8.2.2.2, StartUpOnOff applied by on_off::start_up when the application supplies the previous value (attributes are not persisted by the stack). OnOff carries the BDB default reporting configuration."
[[requirement]]
id = "PW-ZCL-GEN-007"
section = "§3.10"
summary = "Level Control cluster: CurrentLevel and related attributes; Move to Level, Move, Step, Stop (with/without On/Off), transitions and rate semantics"
level = "mandatory"
status = "implemented"
module = "panweave-zcl::clusters::level"
tests = ["level_transitions_run_on_the_tick_and_couple_with_on_off", "scenes_store_recall_and_the_global_scene"]
notes = "Move to Level / Move / Step / Stop and the with-On/Off variants with OptionsMask/OptionsOverride and ExecuteIfOff processing; linear transitions driven by the dispatcher's 100 ms tick with RemainingTime; Rate 0xff uses DefaultMoveRate; clamped steps shorten proportionally; with-On/Off commands set OnOff (and GlobalSceneControl) per §3.10.2.3.6; Table 3-55 On/Off fades with OnLevel/On-/OffTransitionTime and restoration of the stored level (applied on a change of OnOff only); CurrentFrequency / Move to Closest Frequency are not implemented; StartUpCurrentLevel is applied by level::start_up on the application's request."
[[requirement]]
id = "PW-ZCL-GEN-008"
section = "§3.11"
summary = "Alarms cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::alarms"
tests = ["table_and_commands", "battery_alarm_reaches_the_bound_client_with_a_time_stamp"]
notes = "Alarm table (oldest replaced when full), AlarmCount, Reset Alarm / Reset All Alarms (handed to the application as ZclEvent::AlarmReset), Get Alarm / Get Alarm Response and Reset Alarm Log executed by the dispatcher; Zcl::raise_alarm logs and sends the Alarm command to bound clients, time-stamped from a Time server on the same endpoint."
[[requirement]]
id = "PW-ZCL-GEN-009"
section = "§3.12"
summary = "Time cluster"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::time"
tests = ["clock_runs_and_guards_writes", "battery_alarm_reaches_the_bound_client_with_a_time_stamp"]
notes = "Time, TimeStatus (fixed Master / MasterZoneDst bits, Synchronized cleared on a master), TimeZone, DstStart / DstEnd / DstShift, StandardTime, LocalTime, LastSetTime and ValidUntilTime; the clock runs on the dispatcher's monotonic time, a network write of Time is refused on a master clock (READ_ONLY) and otherwise applied as the new base with ZclEvent::TimeSet; the zone attributes are read-only under MasterZoneDst. The client-side server selection rules of §3.12.2.2.2 are documented, not automated."
[[requirement]]
id = "PW-ZCL-GEN-010"
section = "§3.15"
summary = "Diagnostics cluster"
level = "optional"
status = "not-implemented"
module = "panweave-zcl::clusters::diagnostics"
tests = []

[[requirement]]
id = "PW-ZCL-GEN-011"
section = "§3.16"
summary = "Poll Control cluster: check-in, fast polling, long/short poll intervals"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::poll_control"
tests = ["poll_control_server_checks_in_and_fast_polls", "poll_control_check_in_puts_the_sleepy_device_into_fast_poll_mode"]
notes = "Server: Table 3-132 attributes with the CheckInInterval/FastPollTimeout write validation, Check-in to the bound clients at a constant CheckInInterval (§3.16.6.1, re-armed when the attribute changes), temporary fast poll mode for 7.68 s awaiting responses, Check-in Response (longest timeout wins, INVALID_FIELD above FastPollTimeoutMax, FAILURE when late), Fast Poll Stop, Set Long/Short Poll Interval with the §3.16.4.2 relationships; the runtime switches the MAC poll rate on ZclEvent::FastPoll / LongPollInterval. Client: answers Check-ins with a configured policy and raises ZclEvent::CheckIn. The 'unbound client → FAILURE' SHOULD is not enforced (the dispatcher does not see the binding table)."
[[requirement]]
id = "PW-ZCL-MEAS-001"
section = "§4.2–§4.8"
summary = "Measurement clusters: Illuminance, Illuminance Level Sensing, Temperature, Pressure, Flow, Water Content (humidity), Occupancy Sensing"
level = "optional"
status = "implemented"
module = "panweave-zcl::clusters::measurement"
tests = ["servers_hold_and_report_readings", "temperature_sensor_reports_through_its_default_configuration"]
notes = "Attribute-only servers with the §4.1.3 range attributes, unknown / invalid markers, default reporting of the measured value (BDB 3.1 §6.5) and application setters: Illuminance Measurement, Illuminance Level Sensing, Temperature, Pressure (incl. the extended scaled set definitions), Flow, Water Content (Relative Humidity / Leaf Wetness / Soil Moisture) and Occupancy Sensing with the sensor-type alignment of Table 4-24; facade endpoints for the Light, Occupancy and Temperature Sensor devices. The occupancy delay / threshold attributes are defined but not instantiated by default."
[[requirement]]
