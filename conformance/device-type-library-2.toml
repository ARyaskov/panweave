# Panweave conformance inventory: Device Type Library Revision 2 (23-02016).

document = "DTL2"
title = "Device Type Library Specification, Revision 2"

[[requirement]]
id = "PW-DTL-GEN-001"
section = "§1.9–§1.13"
summary = "Device definition conventions: attribute lists, permitted transmission modes, device class, groups/scenes clarifications, cluster usage restrictions, transmission handling"
level = "mandatory"
status = "partially-implemented"
module = "panweave-device-library"
tests = ["classification_and_finding_binding_roles"]
notes = "Device classes (Simple / Dynamic / Node) and the cluster classification used for finding & binding are modelled; attribute lists, permitted transmission modes and the groups / scenes clarifications are documentation only."
[[requirement]]
id = "PW-DTL-DEV-001"
section = "§4–§40"
summary = "Device types with device id and mandatory/optional server and client clusters (switches, outputs, scene selector, configuration tool, remote control, combined interface, range extender, mains outlet, door lock and controller, consumption awareness, home gateway, smart plug, white goods, meter interface, lights, light switches, sensors, thermostats, window covering, IAS devices and others)"
level = "mandatory"
status = "implemented"
module = "panweave-device-library"
tests = ["light_and_switch_endpoints", "appliance_and_energy_device_types", "every_buildable_device_type_validates"]
notes = "All 47 device types of Table 3 with their mandatory server / client clusters (from the PICS tables) are generated from metadata/devices.toml; optional clusters are not recorded. The facade instantiates every cluster a device type lists (endpoint builders for the lights, switches, sensors, thermostat, window covering, door lock, ballast, on/off sensor, IAS devices, White Goods and the Trust Center utility endpoint; Home Gateway, Smart Plug, Meter Interface and Consumption Awareness need the smart-energy feature for the Metering cluster of panweave-smart-energy and report it through unsupported_clusters without it). Every buildable device type passes endpoints::validate."
[[requirement]]
id = "PW-DTL-VAL-001"
section = "§1.4, per-device cluster requirements"
summary = "Validation of endpoint composition against device type requirements (required clusters, attributes, commands)"
level = "mandatory"
status = "implemented"
module = "panweave::endpoints"
tests = ["missing_clusters_are_reported", "every_buildable_device_type_validates", "validation_reports_deficiencies"]
notes = "DeviceType::missing / conforms validate the mandatory cluster lists of a simple descriptor; panweave::endpoints::validate additionally checks that every declared cluster has an instance and that server instances carry the unconditionally mandatory attributes and both sides receive the mandatory cluster-specific commands of panweave_zcl::requirements (ZCL rev 8 M/O columns, conditional M* items excluded). Every buildable device type of the library passes."
