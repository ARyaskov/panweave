# Panweave conformance inventory: Device Type Library Revision 2 (23-02016).

document = "DTL2"
title = "Device Type Library Specification, Revision 2"

[[requirement]]
id = "PW-DTL-GEN-001"
section = "§1.9–§1.13"
summary = "Device definition conventions: attribute lists, permitted transmission modes, device class, groups/scenes clarifications, cluster usage restrictions, transmission handling"
level = "mandatory"
status = "partially-implemented"
module = "panweave-device-library"
tests = ["classification_and_finding_binding_roles"]
notes = "Device classes (Simple / Dynamic / Node) and the cluster classification used for finding & binding are modelled; attribute lists, permitted transmission modes and the groups / scenes clarifications are documentation only."
[[requirement]]
id = "PW-DTL-DEV-001"
section = "§4–§40"
summary = "Device types with device id and mandatory/optional server and client clusters (switches, outputs, scene selector, configuration tool, remote control, combined interface, range extender, mains outlet, door lock and controller, consumption awareness, home gateway, smart plug, white goods, meter interface, lights, light switches, sensors, thermostats, window covering, IAS devices and others)"
level = "mandatory"
status = "partially-implemented"
module = "panweave-device-library"
tests = ["light_and_switch_endpoints"]
notes = "All 47 device types of Table 3 with their mandatory server / client clusters (from the PICS tables) are generated from metadata/devices.toml; optional clusters are not recorded. The facade instantiates every general, measurement, lighting, HVAC, closure and IAS cluster a device type lists (endpoint builders for the lights, switches, sensors, thermostat, window covering, door lock, ballast, on/off sensor, IAS devices and the Trust Center utility endpoint); device types needing the appliance, power profile, metering or partition clusters (Home Gateway, Smart Plug, White Goods, Meter Interface) still report them through unsupported_clusters."
[[requirement]]
id = "PW-DTL-VAL-001"
section = "§1.4, per-device cluster requirements"
summary = "Validation of endpoint composition against device type requirements (required clusters, attributes, commands)"
level = "mandatory"
status = "partially-implemented"
module = "panweave-device-library"
tests = ["missing_clusters_are_reported"]
notes = "DeviceType::missing / conforms validate the mandatory cluster lists of a simple descriptor; required attributes and commands are not checked."
