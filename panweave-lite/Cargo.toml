[package]
name = "panweave-lite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Panweave Lite: the Panweave Zigbee stack dimensioned for battery IAS Zone sensors on microcontrollers with 32 KiB of RAM"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
std = ["panweave-types/std", "panweave-runtime/std", "panweave-bdb/std", "panweave-security/std"]
# Curve25519 SPEKE dynamic link keys (R23 §4.4.9) as the initiator.
dlk = ["panweave-runtime/dlk", "panweave-security/dlk"]
defmt = ["dep:defmt", "panweave-types/defmt", "panweave-runtime/defmt", "panweave-bdb/defmt"]

[dependencies]
panweave-types = { workspace = true }
panweave-security = { workspace = true }
panweave-mac = { workspace = true }
panweave-nwk = { workspace = true }
panweave-aps = { workspace = true }
panweave-zdo = { workspace = true }
panweave-zcl = { workspace = true }
panweave-bdb = { workspace = true }
panweave-storage = { workspace = true }
panweave-runtime = { workspace = true }
heapless = { workspace = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
panweave-security = { workspace = true, features = ["crypto-software", "dlk"] }
panweave-lite = { path = ".", features = ["dlk"] }
panweave-runtime = { workspace = true, features = ["dlk"] }
panweave-testkit = { workspace = true }
# Path only (a dev-dependency cycle through the simulator).
panweave-sim = { path = "../panweave-sim" }
panweave-hub = { workspace = true, features = ["engine", "std"] }

[lints]
workspace = true
