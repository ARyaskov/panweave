[package]
name = "panweave-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Panweave Zigbee stack: sans-I/O stack driver composing MAC, NWK, APS, ZDO and ZCL"
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Curve25519 SPEKE dynamic link keys (R23 §4.4.9).
dlk = ["panweave-security/dlk"]
# Green Power Basic Proxy (GP Basic 1.1.2).
green-power = ["dep:panweave-green-power"]
# Smaller ZCL tables: 8 clusters × 24 attributes per endpoint instead of
# 12 × 36 (see docs/footprint.md).
small-tables = []
std = ["alloc", "panweave-types/std", "panweave-mac/std", "panweave-nwk/std", "panweave-aps/std", "panweave-zdo/std", "panweave-zcl/std", "panweave-bdb/std", "panweave-storage/std", "panweave-security/std"]
alloc = ["panweave-types/alloc"]
serde = ["dep:serde", "panweave-types/serde"]
defmt = ["dep:defmt", "heapless/defmt", "panweave-types/defmt", "panweave-mac/defmt", "panweave-nwk/defmt", "panweave-aps/defmt", "panweave-zdo/defmt", "panweave-zcl/defmt", "panweave-bdb/defmt", "panweave-storage/defmt"]

[dependencies]
panweave-types = { workspace = true }
panweave-codec = { workspace = true }
panweave-security = { workspace = true }
panweave-mac = { workspace = true }
panweave-nwk = { workspace = true }
panweave-aps = { workspace = true }
panweave-zdo = { workspace = true }
panweave-zcl = { workspace = true }
panweave-bdb = { workspace = true }
panweave-storage = { workspace = true }
panweave-green-power = { workspace = true, optional = true }
heapless = { workspace = true }
serde = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
panweave-security = { workspace = true, features = ["crypto-software", "dlk"] }
panweave-runtime = { path = ".", features = ["dlk", "green-power"] }
panweave-testkit = { workspace = true }
panweave-sim = { workspace = true }
panweave-pcap = { workspace = true }
panweave-green-power = { workspace = true }

[lints]
workspace = true
