[package]
name = "panweave-smart-energy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Panweave Zigbee stack: Smart Energy 1.4a clusters, devices, CBKE and the metering / price / DRLC / messaging drivers"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
std = ["alloc", "panweave-types/std", "panweave-security/std", "panweave-zcl/std"]
alloc = ["panweave-types/alloc"]
serde = ["dep:serde", "panweave-types/serde"]
defmt = ["dep:defmt", "panweave-types/defmt", "heapless/defmt"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
panweave-types = { workspace = true }
panweave-security = { workspace = true }
panweave-codec = { workspace = true }
panweave-zcl = { workspace = true }
panweave-aps = { workspace = true }
heapless = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
panweave-security = { workspace = true, features = ["crypto-software"] }
panweave-sim = { workspace = true }
panweave-runtime = { workspace = true, features = ["std"] }
panweave-mac = { workspace = true }
panweave-zdo = { workspace = true }
panweave-storage = { workspace = true }
panweave-testkit = { workspace = true }

[lints]
workspace = true
