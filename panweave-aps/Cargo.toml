[package]
name = "panweave-aps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Panweave Zigbee stack: application support sub-layer (frames, ack/retry, fragmentation, binding, groups, APS security commands)"
keywords.workspace = true
categories.workspace = true

[features]
default = []
std = ["alloc", "panweave-types/std", "panweave-codec/std", "panweave-security/std"]
alloc = ["panweave-types/alloc", "panweave-codec/alloc"]
serde = ["dep:serde", "heapless/serde", "panweave-types/serde"]
defmt = ["dep:defmt", "heapless/defmt", "panweave-types/defmt", "panweave-codec/defmt", "panweave-security/defmt"]

[dependencies]
panweave-types = { workspace = true }
panweave-codec = { workspace = true }
panweave-security = { workspace = true }
heapless = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
serde = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
panweave-security = { workspace = true, features = ["crypto-software"] }

[lints]
workspace = true
