[package]
name = "panweave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent Rust implementation of IEEE 802.15.4-based Zigbee protocol functionality"
keywords.workspace = true
categories.workspace = true

[features]
default = []
std = ["alloc", "panweave-types/std", "panweave-runtime/std", "panweave-bdb/std", "panweave-testkit/std", "panweave-security/std"]
alloc = ["panweave-types/alloc"]
serde = ["panweave-types/serde"]
defmt = ["panweave-types/defmt", "panweave-runtime/defmt", "panweave-bdb/defmt"]
crypto-software = ["panweave-security/crypto-software"]
# Curve25519 dynamic link keys (R23 §4.4.9).
dlk = ["panweave-runtime/dlk", "panweave-security/dlk"]
# Zigbee Direct 1.1 device (ZDD) binding of the commissioning service.
direct = ["dep:panweave-direct"]
# Smart Energy 1.4a endpoints (Table 5-13 devices) and clusters.
smart-energy = ["dep:panweave-smart-energy"]
# Smaller ZCL tables (8 clusters × 24 attributes per endpoint); see
# docs/footprint.md.
small-tables = ["panweave-runtime/small-tables"]

[dependencies]
panweave-types = { workspace = true }
panweave-codec = { workspace = true }
panweave-security = { workspace = true }
panweave-mac = { workspace = true }
panweave-nwk = { workspace = true }
panweave-aps = { workspace = true }
panweave-zdo = { workspace = true }
panweave-zcl = { workspace = true }
panweave-bdb = { workspace = true }
panweave-device-library = { workspace = true }
panweave-runtime = { workspace = true }
panweave-storage = { workspace = true }
panweave-testkit = { workspace = true }
panweave-direct = { workspace = true, optional = true }
panweave-smart-energy = { workspace = true, optional = true }
heapless = { workspace = true }

[dev-dependencies]
panweave-security = { workspace = true, features = ["crypto-software"] }
panweave-sim = { workspace = true }
panweave-direct = { workspace = true, features = ["curve25519"] }
panweave = { path = ".", features = ["direct", "smart-energy"] }

[[test]]
name = "direct"
required-features = ["direct"]

[[test]]
name = "cbke"
required-features = ["smart-energy"]

[[test]]
name = "se_messaging"
required-features = ["smart-energy"]

[[test]]
name = "se_drlc"
required-features = ["smart-energy"]

[[test]]
name = "se_price"
required-features = ["smart-energy"]

[[test]]
name = "se_metering"
required-features = ["smart-energy"]

[[test]]
name = "se_commissioning"
required-features = ["smart-energy"]

[[test]]
name = "se_trust_center"
required-features = ["smart-energy"]

[lints]
workspace = true
