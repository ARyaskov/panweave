[package]
name = "panweave-hub-cli"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Panweave hub: development command-line client for the Panweave Hub Protocol over USB serial"
readme = "README.md"
keywords = ["zigbee", "ieee802154", "iot", "cli", "hub"]
categories = ["command-line-utilities", "embedded"]

[[bin]]
name = "panweave-hub-cli"
path = "src/main.rs"

[dependencies]
panweave-hub = { workspace = true, features = ["std"] }
heapless = { workspace = true }
serialport = { version = "4.10.1", default-features = false }
# Ctrl+C ends `watch`, `capture export` and `self-test` cleanly (the
# capture is stopped on the hub and the pcap file finished) on Windows and
# Unix alike; the standard library has no portable signal handling.
ctrlc = "3.5"
panweave-pcap = { workspace = true }

[lints]
workspace = true
